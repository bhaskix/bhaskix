[package]
name = "bhaskix-kernel"
description = "The Bhaskix nucleus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "bhaskix_kernel"
path = "src/lib.rs"

[dependencies]
bhaskix-abi = { path = "../abi" }
bhaskix-boot = { path = "../boot/handoff" }
bhaskix-arch-x86-64 = { path = "../arch/x86_64" }
bhaskix-mm = { path = "../mm" }
bhaskix-device = { path = "../device" }
bhaskix-fs = { path = "../fs" }
# RFC 0028 step 4: the ELF parser, extracted so the boot loader can run
# the same fuzz-hardened checks. The loader half stays here, with the
# address spaces it needs.
bhaskix-elf = { path = "../elf" }
# RFC 0038/0041: the vendored xHCI layouts. The ring cursors in
# `kernel/src/xhci.rs` are this project's own logic built on them.
bhaskix-usb = { path = "../usb" }
bhaskix-xhci = { path = "../third_party/xhci" }
# RFC 0046. The kernel drives no AHCI controller -- `bin/ahcid` does -- and
# depends on the crate anyway for the two constants the *report format* is made
# of. The alternative was a literal 32 here and `MAX_PORTS` there, which is a
# format defined twice and a drift waiting to happen.
bhaskix-ahci = { path = "../ahci" }
# RFC 0021. The kernel does not need unpredictability itself yet -- randomising
# the heap base is that RFC's open question 2 -- but it is the thing that boots,
# so it is where "the instruction actually works on this machine" is checked.
bhaskix-rand = { path = "../rand" }
# RFC 0026. The plane's arithmetic: the event's wire form, the schema
# registry, and every ring decision. The kernel contributes the stores and
# the interrupt discipline; the decisions stay host-tested in the crate.
bhaskix-telemetry = { path = "../telemetry" }
# RFC 0005: the Linux personality's arithmetic. The kernel builds a real
# initial process stack by calling into it; the bytes are host-tested there.
bhaskix-personality = { path = "../personality" }
# RFC 0013: the framework, and the services placed in the nucleus. The arrow
# points this way and only this way -- a service crate never depends back.
bhaskix-service = { path = "../service" }
bhaskix-service-console = { path = "../services/console" }
bhaskix-service-vfs = { path = "../services/vfs" }

[lints]
workspace = true

[package.metadata.bhaskix]
# 10 — three `CPUID` reads during SMP bring-up, reading `RSP` and `CS` where
# no abstraction can answer, and four deliberate faults in `faultinject`, which
# exists to prove the exception path by taking one. The rest is in `arch/`.
asm_budget = 10
# **This header said, from M1 until 2026-08-20, that `unsafe` here is confined
# to `sync`, `framebuffer`, `trap` and `faultinject`, and that no other module
# may contain any. The log below refutes it in its own words** -- it records the
# growth into `memory`, `vm`, `stack`, per-CPU bring-up and the rest -- and the
# two sat in this file together, unnoticed, because a header is read once and a
# log is appended to.
#
# What is true: 1588 lines across 25 files, the largest being `lib.rs` (612 --
# the boot report and the hosted probes), `iommu` (201), `virtio` (152), `vm`
# (147), `smp` (106) and `irq` (103). The confinement that exists is this
# number and the `// SAFETY:` comment on every block, both checked by CI. See
# docs/security.md §5, which carried the same wrong sentence and now carries
# the correction.
#
# Measured: 24 at M1, 57 after exceptions, 119 after interrupt bring-up.
# The last increase is the APIC and PIC setup sequence in `trap::enable` and
# the end-of-interrupt calls in the dispatcher, none of which can be expressed
# safely -- they are device register writes with ordering requirements.
# 249 used at M3. The increases are `memory.rs` turning a physical address into
# the `&'static mut [Frame]` backing the frame database, `vm.rs` driving the
# page-table walker and zeroing freshly allocated frames, and `stack.rs`
# switching RSP -- which no safe abstraction can express, since changing the
# stack pointer invalidates every local in the frame doing it.
# 300 at M3-10. The last increase is the demand-paging and copy-on-write fault
# path -- copying a frame, and the volatile accesses in the self-test that
# deliberately touch unmapped memory to make the handler run.
# 354 at M3-12, for the user-copy calls in the self-tests. Those are unsafe by
# nature: they hand a deliberately bad pointer to a routine whose contract is
# that bad pointers are ordinary input.
# 430 at M4-06, per-CPU runqueues. Two sources, neither avoidable. Secondary
# bring-up is a fixed sequence of operations that are individually unsafe and
# only correct in one order -- claim identity, load descriptor tables, activate
# GS -- and expressing it as one `unsafe` block per step is what makes each
# ordering constraint documentable where it applies. The rest is the switch
# path: raw context pointers taken out of a runqueue and handed to assembly
# that changes RSP, which no safe signature can describe.
# 460 at M4-10, tickless timers. The timer path is unsafe by nature: arming and
# disarming a device register, called from an interrupt handler, on a CPU whose
# APIC state the type system cannot describe. Each step is a separate block so
# that its own precondition -- "the APIC is initialised", "this is the timer
# handler, after acknowledgement" -- is stated where it applies rather than
# once for a whole function.
# 500 at M5-04, ring 3. Entering user mode is a sequence of individually
# unsafe steps whose preconditions differ -- mapping a user-executable page,
# writing a program through the direct map rather than through the mapping it
# will run from, installing an address space, setting RSP0, and finally the
# transition itself. One block per step is what lets each precondition be
# stated where it is actually owed.
# 580 at M6-04, the kernel shell and the console input path. Three sources.
# Mapping firmware tables on demand: the RSDP on a BIOS machine sits in the
# legacy area below one megabyte, which no bootloader maps, so each page is
# translated and mapped before it is read. Driving the UART's receive side and
# its loopback mode from the self-test. And rebuilding the `IoApic` and
# `SerialPort` wrappers around an address held in an atomic, which is what
# keeps the interrupt handler free of locks.
# 800 at M6-06, the block driver. Almost all of the increase is one module:
# a device driver is unsafe by nature, and virtio concentrates it. Registers
# are volatile accesses to a mapped window; the virtqueue is a structure the
# *device* reads and writes by DMA, so every descriptor is written volatile at
# a physical address the driver allocated, and every completion is read the
# same way. None of it can be expressed safely, because the other party to
# every one of these accesses is not a thread and holds no lock -- which is
# exactly why each block says which frame it is touching and who else may be
# looking at it.
# 860 at M6-07, RFC 0011 steps 1-4. The increase is one function: programming
# an MSI-X table entry, which is four volatile writes to a mapped device table
# plus the configuration accesses that find it. It is deliberately the only
# place that does so -- an MSI is a device write of an arbitrary vector to an
# arbitrary CPU, so this is the code the RFC says must never be delegated, and
# keeping it in one function is what makes "never delegated" checkable.
# 890 at M6-10, RFC 0012 step 2. The increase is three functions in `iommu`,
# and every one of them writes a structure the *hardware* will walk rather than
# the CPU: a zeroed frame for a table, the root and context entries that select
# a device's page tables, and the read-back that checks them. They are volatile
# writes through the direct map at offsets bounded by construction -- a root
# index is a byte, a context index is masked to eight bits, so neither can
# leave its page.
#
# It buys the thing the whole RFC exists for. Until now every DMA-capable
# device could reach all of physical memory, including the kernel, and the
# machine said so at boot because there was nothing else to say. This is the
# code that ends that, and it is deliberately confined to one module so that
# "what can a device reach" has one answer in one place.
# 950 at M6-12, RFC 0012 step 3. The increase is the page-table walk and the
# enable sequence: reading and writing second-level entries through the direct
# map, and driving a remapping unit's registers. Every index is nine bits and
# every table is a frame this module allocated and zeroed, so no access can
# leave the page it is walking.
#
# The trade is worth stating plainly, because it is what the milestone bought.
# Before this, a `virtio-blk` device could read the kernel's memory and the
# machine said so at boot for want of anything better to say. After it, that
# device reaches five frames it was given and nothing else -- enforced by
# hardware, and demonstrated by deliberately unmapping them and watching the
# disk disappear.
# 1000 at M6-13, RFC 0012 step 4. `MAP` and `UNMAP`: walking the second-level
# tables to place and remove one page, and reading the unit's fault record so a
# refusal names the device rather than counting one. Every index is nine bits
# and every table is a frame this module allocated, so no access leaves the page
# it is walking.
#
# What it buys is the sentence the boot log can now print truthfully: this
# device reaches only what it was given. Demonstrated, not asserted -- the
# machine hands the device an address nobody mapped and reports the hardware
# refusing it by name.
# 1040 at M6-15, RFC 0012 step 6. Writing interrupt remapping entries: the
# high half first, because the low half carries the present bit and publishing
# an entry whose source and destination are still zero is a handle anything may
# use. The table is a frame this module allocated and zeroed, at an index
# bounded before the write.
# 1070 at M6-19. Queued invalidation: a zeroed page for the unit's own ring,
# which the specification requires be enabled before interrupt remapping.
# Register-based invalidation keeps working without it, which is exactly why
# the requirement is easy to miss -- it was, here, until an experiment went
# looking for it. It did not fix the undelivered MSI and the code is still
# more correct for it.
# 1115 at M6-20. Routing invalidations to the queue when it is on. The frame
# for the status word the unit writes, and the direct-map pointers to it and to
# the ring. This is the other half of the note above, and it corrects it:
# enabling queued invalidation did not merely fail to fix the MSI, it stopped
# the context cache and the IOTLB being invalidated at all, because the
# register writes left behind are the ones the unit now ignores. The kernel's
# own gate said so -- "the context cache did not invalidate" -- in a boot that
# was already red for the MSI, which is how it went unread.
# 1120 at M6-21. Adopting the unit's own command state before issuing a command
# to it, and asserting translation survived. Three lines that close the fault
# the four above were chasing: a `Unit` built fresh carries a zeroed shadow of
# a write-only `GCMD`, so the first command written through it cleared the
# translation-enable bit and turned the IOMMU off.
# 1122 at M6-22. One read of an object's frame through the direct map, in the
# self-test that proves a reused device address translates to the object that
# owns it now. There is no safe way to look at a page a device just wrote, and
# looking is the entire test: without it the check would pass on a stale
# translation, because a stale translation writes to the old page and reports
# nothing.
# 1126 at M9-24. `fill_from` gained an offset, so a service that copies through
# a buffer of its own can say where each piece goes. The two `unsafe` lines are
# the same direct-map slice as before, now started part-way into a frame -- and
# the bulk self-test gained a second object and a read that crosses a page,
# which is the check that would have caught the divergence this fixes: the
# domain placement delivered one page and called it the file, while the nucleus
# placement delivered all four.
# 1139 at RFC 0018 steps 2 and 3. The last three are the direct-map read of
# the page `bin/ipd` leaves its findings in.
# 1136 at RFC 0018 step 2. Nine lines, all of them delegation the block path
# already performs for its device: claiming the network device's MSI-X entry,
# and two direct-map reads of the page `bin/netd` leaves its report in. The
# kernel gains no network code at all -- there is no kernel driver for this
# device class and RFC 0018 says there will not be one -- so what grew is the
# handing over, not the driving.
# 1152 at RFC 0018 step 4a: the configuration page the kernel writes for
# `bin/ipd`, and the direct-map read of the driver report it takes the address
# from.
# 1157 at RFC 0018 step 6: the driver's and the service's reports are read a
# second time, *after* the DHCP exchange rather than before it. Reading them
# once before the thing being measured had happened is what made three separate
# wrong diagnoses possible.
# 1158 at RFC 0018 step 7: one more report page read, to time the echo burst
# from a program that has no clock of its own.
# 1159 while the address-space instrumentation is in: one `CR3` read on the way
# back to ring 3, to check the thread about to run owns the space that is
# loaded. Reading `CR3` at CPL 0 has no side effects; the cost is the check, and
# the boot cost did not move (7677 ms against 7678 before it).
# 1166 at RFC 0019's question 2, closing it: the `ARM` path re-programs this
# CPU's timer. Seven lines, and none of them a new capability -- the arming
# itself is `apic::arm_oneshot`, which the tick already calls, moved into a
# `program` helper the tick and the new path share so the deadline-to-count
# conversion has one copy rather than two. The rest is masking and restoring
# interrupts around it, which is the `frames::with_reserve` idiom: this reads
# which CPU it is on and then writes that CPU's timer, and preempted between
# the two it would arm the wrong processor's.
# 1193 at RFC 0020 steps 4 and 5: the TCP domain's configuration page is
# written and its report page read, both through the direct map, the same
# shape as ipd's; two lines in `virtio::quiesce_delegated`, the reset that
# stops the firmware's rings being live behind a translation; and two bounded
# readiness waits that poll a report page each -- for the TCP demonstration's
# terminal outcome, and for ipd's serving bit before the DHCP client starts.
#
# 1209 at RFC 0022 step 4: starting bin/tcpc costs the same shapes every
# program start costs -- an address-space install, the ring transition, and
# the client's report page read through the direct map for the outcome wait
# and the printer. Nothing new in kind, sixteen lines in count.
#
# 1219 at RFC 0020 step 6: the client's six measurement words, read out of
# its report page through the direct map for the printer -- the same shape
# as every report word above, ten lines in count.
#
# 1220 at the pipeline attribution: one more report-page word read through
# the direct map, the same shape as every report word above.
#
# 1221 at RFC 0025: one CR4 read at bring-up, the register that says which
# paging world the walks are in.
#
# 1222 at the lock-event ledger: one cast from the stored pointer back to
# the &'static Location it always was, in the stall dump's walk.
#
# 1223 at the open-guards table: the same cast, in the walk over what is
# held right now.
#
# 1225 at the fix the seven captures were for: interrupts enabled for the
# whole of syscall dispatch and disabled again for the exit stub -- the two
# sti/cli calls that end the deafness which stretched one heap hold to
# forty-two seconds.
#
# 1226 at the longest-holds gauge: the same Location cast once more, in the
# record holder's read-out.
#
# 1227 at the exception report's first line: one CR3 read, so the densest
# diagnostics print before a harness cap can cut them off -- the lesson of
# the run-312 specimen, which lost everything after its fifth line.
#
# 1240 at RFC 0026 step 2: the telemetry emit path's volatile ring stores --
# header words, the untrusted tail read, the slot write, the interrupt
# guard, and init's zeroing. Every decision behind those stores is safe,
# host-tested arithmetic in bhaskix-telemetry, which is the split the RFC
# promised and this number holds it to.
#
# 1248 at steps 3-4: the round trip's kernel half -- the probe burst's tail
# write, and the traced report page read out through the direct map, the
# same shape every report reader pays.
#
# 1293 at RFC 0029 step 4: bin/udp6's report page read and the address-space
# install for its entry, the same three lines every kernel-started client
# pays (bin/dhcp's shape exactly).
#
# 1294 at the fatal-console instrument run-80 named: one aliasing read of
# the console behind a lock a wedged machine may never release -- the
# deliberate data race that turns a silent wedge into a torn line.
#
# 1290 at RFC 0028 step 7: native secondary bring-up. The trampoline copy and
# its patches through the direct map, the bring-up root's frame writes, the
# stack mailbox viewed as the atomic it is, the MADT walk reusing irq's own
# ensure-mapped closure shape, and the INIT-SIPI sends. All writes to memory
# no Rust object owns -- a page reserved at boot for a processor that does
# not exist yet.
#
# 1302 at RFC 0029 step 6 (2026-08-18): the tcpc report page's four v6
# measurement words read out through the direct map -- the same
# report-reader shape the v4 measures pay at words four to nine, eight
# lines for one more volatile block over the frame the client owns.
#
# 1324 at RFC 0005 step 2 (2026-08-19): the personality self-test's probe --
# hand-assembled code copied through the direct map exactly as the ELF
# loader fills a page, the ring 3 entry, and the report frame read back.
# All idioms this file already carries, pointed at a Linux-tagged domain.
#
# 1344 at RFC 0005 step 3 (2026-08-19): the auxv witness -- three page fills
# through the direct map (code, the built stack image, the report read back)
# and its ring 3 entry. The image itself is built by `bhaskix-personality`,
# which is zero-unsafe arithmetic; only the placing of it is here.
#
# 1370 at RFC 0005 step 4 (2026-08-19): the signal witness -- its page fills
# and ring 3 entry -- plus the delivery path's two fault-protected copies
# (the frame out to the process's own stack, the sigcontext back in) and the
# sigaction/sigaltstack reads. Every one is `uaccess`, which is the routine
# whose whole contract is that a bad user pointer is ordinary input.
#
# 1390 at RFC 0005 step 5 (2026-08-19): the memory witness -- its page fills,
# ring 3 entry, and the four report words read back.
#
# 1424 at RFC 0005 step 6 (2026-08-19): the futex witness -- page fills, ring
# 3 entry, and its marker-plus-seven report words read as one block -- plus
# the one fault-protected read of a futex word. The futex table itself needs none: the queues live outside the lock,
# each carrying its own.
#
# 1450 at the clone half of RFC 0005 step 6 (2026-08-19): the two-thread
# witness -- page fills, ring 3 entry, marker-plus-five report words -- and
# `cloned_thread`'s own entry into ring 3 at an address its caller chose.
#
# 1482 at RFC 0005 step 7 (2026-08-19): SSE enabled on every CPU, the
# floating-point file saved and restored at both switch sites (which is what
# makes enabling it safe), the per-thread FS base, and the Tier 0 loader
# thread that puts a real Go binary into a domain.
# 1595 as of 2026-08-21: 1588 plus the seven lines of RFC 0036 step 2's
# comparator -- two static buffers and one `copy_nonoverlapping` through the
# direct map, which is the floor the supervised copy is measured against. A
# measurement that cost nothing to take would be measuring nothing.
# 1621 at RFC 0037, 2026-08-22: twenty-six lines for the i8042 keyboard, and
# every one of them is a port read or write. There is no way to talk to this
# device that is not `in`/`out` on two fixed ports, so the cost is the driver
# existing at all rather than any choice inside it. What the count does *not*
# include is the part most likely to be wrong: the scancode tables and their
# translation are a pure function with no hardware in it, tested on the host,
# and hold no `unsafe` at all.
# 1622 at RFC 0041 step 2, 2026-08-22: one line, the configuration-space read
# that tells an xHCI controller apart from a UHCI or EHCI one. The scan around
# it is safe code, and the decision it feeds -- whether the IOMMU translates
# for that device -- holds no `unsafe` at all. A controller that is not
# translated is refused before any register of it is touched.
# 1715 at RFC 0041 step 3, 2026-08-23: +93, for driving a controller rather
# than only finding one. Where it went, and why none of it could be avoided:
#   * the register banks -- three `register_block!` blocks, so one
#     `Mmio::new` per bank carries the promise and every read and write
#     afterwards is *safe*. This is `coding-style.md` §3's own preference
#     applied: fifty individually-correct volatile accesses would have been
#     fifty unsafe lines and fifty chances to be wrong about a width.
#   * the DMA memory -- allocating a frame, zeroing it, and writing the
#     scratchpad array, the device context array's entry zero and the event
#     ring segment table. Every one is a store the *controller* will read by
#     DMA, so none of them can be a safe abstraction over something else.
#   * the PCI configuration writes that enable memory space and, separately
#     and later, bus mastering.
# What is not in it: the bring-up sequence itself, the bounds on every number
# the controller reports, and all thirty-one host tests -- test code is
# excluded from the budget by the checker, which is why the model that drives
# this driver costs nothing.
# 1804 at RFC 0041 step 4, 2026-08-23: +89, for asking the controller a
# question and reading its answer. Almost all of it is one thing -- reaching
# DMA memory the *controller* also writes -- and none of it can be a safe
# abstraction over something else:
#   * the command ring: the Link TRB that closes it (step 3 wrote none, which
#     cost nothing while nothing read the ring and would have stopped the
#     controller after fifteen commands once something did), and the No-Op
#     command itself.
#   * the event ring: a volatile read per entry, through a closure, because the
#     controller writes these while the drain runs -- a `&[Trb]` over that
#     memory would be a shared reference to something else's writes.
#   * the doorbell and the dequeue pointer: one `Mmio::new` each.
# What is not in it: `drain` itself, which is pure and takes the reader as a
# closure precisely so it can be host-tested, and `command_ring_link`, which is
# the link *decision* separated from the store so a test can hold it.
# 1896 at RFC 0041 step 5, 2026-08-23: +92, for enumerating a port and
# addressing the device on it. Where it went:
#   * the port scan: one `Mmio::new` per port register, and `PORTSC` is the
#     most dangerous register in the controller to read-modify-write -- seven
#     write-one-to-clear bits and bit 1 write-one-to-*disable* -- so every
#     write goes through `preserving` or `acknowledging`.
#   * three more DMA structures written for the controller to read: the device
#     context array entry for the slot, the control endpoint's transfer ring
#     and its link, and the input context's three contexts.
#   * one volatile read back of the device context the controller wrote, which
#     is what turns "the command was accepted" into "the controller did it".
# What is not in it: `address_device_input`, which builds all three contexts as
# `(offset, dwords)` and is pure, so the input-context arithmetic RFC 0041
# calls the trap is held by host tests rather than by a comment.
# 2027 at RFC 0041 step 6, 2026-08-23: +131, for asking a device what it is and
# configuring the endpoint it answers on. Where it went:
#   * control transfers: each stage written onto the endpoint's ring, the
#     slot doorbell, and one `from_raw_parts` over the buffer the device wrote
#     descriptors into -- untrusted bytes, handed straight to `bhaskix-usb`,
#     which is `forbid(unsafe_code)` and fuzzed.
#   * Configure Endpoint: a second transfer ring and its link, a second input
#     context's three contexts, and the read-back of the endpoint context the
#     controller wrote.
# What is not in it, and this is where the step's real content lives:
# `control_transfer_stages`, `configure_endpoint_input` and `interval_exponent`
# are pure. Which stages exist, which way each points, which one carries
# Interrupt On Completion, and the Device Context Index arithmetic RFC 0041
# calls the trap are all decided in safe code that host tests hold.
# 2095 at RFC 0041 step 7, 2026-08-23: +68, for reading reports and typing them.
# The smallest increment of the six, and deliberately: the interrupt path had to
# be cheap because it runs with a lock held.
#   * `arm`: one Normal TRB written to the interrupt endpoint's ring, and its
#     doorbell -- once at install and once after every report.
#   * `drain_reports`: the volatile read per event-ring entry, the dequeue and
#     IMAN writes that re-arm the interrupter, and one `from_raw_parts` over the
#     bytes the device wrote, bounded by the packet size the endpoint declared.
#   * `install_interrupt`: nothing of its own -- `irq::claim` is safe to call
#     and does the MSI-X programming.
# What is not in it: the report itself is handed to `bhaskix_usb::hid::Keyboard`,
# which is forbid(unsafe_code), and the translation from "the set of keys held"
# to "what was newly pressed" -- the whole difference between a boot report and
# a scancode stream -- happens there.
# 2097 at RFC 0042 step 6, 2026-08-23: +2, for a second UART.
#
# The whole of the increase is `SerialPort::init` on COM2 and the write to it,
# and it is the cheapest two lines in this file's history: the SR550 has two
# serial ports, this kernel probed one, and it spent two hardware boots writing
# a boot report nobody could carry. Writing to both put 19,550 bytes of it on
# serial-over-LAN and closed M1-17, open since Phase 0.
# 2153 at RFC 0046 step 2, 2026-08-24: +11, for finding a SATA AHCI controller.
#
# Four configuration-space reads in `ahci.rs` -- two `for_each` walks and the
# programming-interface byte each of them checks -- one more of the same byte in
# `iommu::survey`, and one configuration *write*: clearing bus mastering on the
# controller before a window goes in front of it, because the firmware looks for
# a boot sector on a SATA disk and does not tidy up afterwards.
#
# It was +46, and the difference is worth recording because it is not a code
# change. `check-unsafe-budget.py` is a line scanner, and
# `if let Some(x) = unsafe { f() } {` leaves it one brace deep -- so it charges
# the entire body of the block to the budget. Hoisting the probe into its own
# `let` took 35 lines off a number that was measuring brace nesting rather than
# danger. **The same shape is still there in RFC 0041's xHCI window**, twenty
# lines above the one this change touched; not fixed here, and recorded in
# TRACKER, because that number is quoted in an accepted RFC.
# 2165 at RFC 0046 step 3b, 2026-08-24: +12, for handing the controller to a
# domain.
#
# One configuration read of BAR5 -- the register file's address, which the
# driver is given and cannot look up for itself -- `enable_memory` so that file
# answers, and the direct-map reads of the report the driver leaves behind. The
# driver itself sits at 22, because the arithmetic it runs on lives in
# `bhaskix-ahci` under `forbid(unsafe_code)`.
# 2166 at RFC 0046 step 4, 2026-08-24: +1, for `pci::enable` -- bus mastering,
# granted only behind a window. Step 3b left it out and said so; step 4 issues a
# command, and a controller that cannot master the bus cannot fetch its own
# command list. On QEMU that was not a clean refusal but a machine with no
# console output at all.
# 2167 at RFC 0046 step 6b, 2026-08-24: +1, for the self-test that asks the AHCI
# service for a sector -- one direct-map read of the frame the service filled,
# which is how the *contents* are checked rather than the byte count.
# 1759 on 2026-08-24, and **not one unsafe operation was deleted**: the
# budget check was over-counting by 408 lines here. It took a whole line's
# brace balance, so `if let Some(x) = unsafe { f() } {` read as still-open and
# charged the outer block's body to this crate. See the changelog; the
# scanner now walks from the block's own brace and has a self-test.
# 1782 with RFC 0043 step 4: `pass_through_to`, the one place an *untranslated*
# context entry is written -- four volatile writes and their pointer
# arithmetic, the same shape `attach_to` has beside it -- plus the bus walk's
