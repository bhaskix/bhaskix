#
# It was 1820 on the first attempt, and the difference is not code: thirty
# lines of reasoning sat *inside* an existing `unsafe` block, where the line
# scanner charges them to the budget. They moved to a function in safe code.
# The number is supposed to mean something, so prose does not get to inflate
# it -- and after this morning's fix to that scanner, it does.
# 1808 for the pre-OS handoff, `take_ownership`: six MMIO accesses against the
# USB Legacy Support capability -- the walk's header read, the semaphore read
# and the write that claims it, the read and write that hand it back when
# firmware will not release, and the pair that disarms firmware's SMI sources.
# Every bit decision they act on is in `bhaskix-xhci::extended`, in safe code
# with host tests; what is charged here is the register access alone, which is
# the split this budget is supposed to reward.
# 1812 for `report_faults`, which reads every fault record the unit holds
# rather than the first: one mapped-window read and the call that drains them.
# 1815 for the controller state a failed command now carries: one mapped
# operational bank, read after the wait so it describes the failure rather than
# what came before it.
# 1825 for RFC 0049 step 2: every unit the firmware named is programmed, so the
# register access that was written once is now written once per unit --
# `program_unit`, `invalidate_contexts_of`, `invalidate_one` and `take_fault_of`
# are each one unit's worth of what `enable` used to do inline, plus the width
# read that now runs across all of them. No new *kind* of access: the same
# operations, reaching the units that were being skipped.
# 1826 for the second fault report: faults are now read once before any driver
# here has touched a device and once after bring-up, so a fault left by whoever
# drove the hardware before this kernel cannot be mistaken for one this kernel
# caused. One extra call, and reading clears the records so the two are
# disjoint by construction.
# 1830 for `report_ports`: every root hub port read and summarised before the
# driver concludes none of them has a device. "No port has a device on it" is
# not a finding on a machine with 26 ports -- unpowered, nothing attached, and
# looked-at-too-early are different bugs and were indistinguishable. One mapped
# port register per port, which is the same access `find_connected_port` makes
# beside it.
# 1835 for the port debounce: `port_connected` reads one port register and
# `debounced_port` samples through it until a connection has held steady, which
# is one mapped register per sample where the old code read each port once.
# The debounce arithmetic itself is safe code beside it.
# 1839 for `settled_after_reset`: the port is debounced a second time, after
# its reset, on connected-and-enabled-and-has-a-speed rather than on a fixed
# recovery interval. One mapped port register, sampled -- the same access
# `port_connected` makes, on the one port already chosen.
# 1857 for xHCI §4.6.5's slot recovery: an Address Device that fails is
# recovered by releasing the slot and taking a new one, which is what the
# specification prescribes for a USB Transaction Error and what this driver did
# not do -- it re-asked the same slot, the one action neither branch of that
# note lists. Four mapped writes and two ring issues: the released slot's entry
# in the device context array cleared, the device context frame zeroed because
# the controller has been writing in it, and the new slot's entry set. None of
# it could be safe code: every one of them is a pointer the controller reads by
# DMA, and the array index is a slot number the controller chose. The
# arithmetic that decides *whether* to recover is safe code beside it.
# 1864 for zeroing a shared object's frames at creation, staging the disclosure
# that proved it, and reading the adapter's fault log. `shared::create` allocated
# frames and handed them to ring 3 services without wiping them, so an object
# arrived carrying the previous tenant's memory -- measured at 3,546 non-zero
# bytes in the worst page. The write is one `write_bytes` per frame through the
# direct map; the self-test that gates it needs two more windows, one to dirty a
# page on purpose and one to read what the next owner sees; and the kernel's
# reader for `bin/linuxd`'s fault log walks the report page like the six readers
# beside it. None of it can be safe code: each is a physical frame reached
# through the direct map, which is a raw pointer by construction.
# 1868 for the clone probe's gate: the kernel reads the parent's announcement
# out of the probe's report page and writes the word the child is spinning on,
# which is what removed the rendezvous race rather than retrying it. Two windows
# through the direct map into a frame the probe's space owns, in the shape the
# same function already uses for the exit phase beside it. Neither can be safe
# code: the page is reached by physical address, which is a raw pointer.
# 1869 for the clone probe's second reader: the kernel now waits for the child's
# own done flag as well as the parent's marker, because `woke` is written by the
# child and the marker by the parent, and reading on the marker alone read a word
# whose writer had not run. One more window through the direct map into the same
# frame the four beside it already read.
# 1875 for RFC 0050's `PUT_RUN`: the console can now put a run of bytes with the
# lock held once, and to do it the kernel reads the run out of the *caller's*
# address space -- the same page-by-page translation `copy_across` performs, with
# `frame_for_read` so a lazily-mapped page is refused rather than committed by
# printing. One window per page through the direct map. It could not be safe
# code: the source is a physical frame reached through the direct map, which is a
# raw pointer by construction. What it buys is a hosted program's line arriving
# whole instead of in halves around an unrelated kernel report.
# 1897 for RFC 0055's `ppoll`/`select` probe: a hosted Linux program written by
# hand, because the corpus asks for neither call and there is otherwise no
# caller to gate them from. Twenty-two lines, and every one of them is the same
# shape every other probe here has -- the machine code copied into a frame the
# probe's own space owns, the space installed, the entry into ring 3, and the
# volatile reads that take its answers back out of the report page. None of it
# could be safe code: a probe's report is a physical frame reached through the
# direct map, which is a raw pointer by construction.
# 1939 for RFC 0056's socket-poll probe: a second hosted Linux program, whose
# thread is the socket probe's scaffolding pointed at a different blob. Forty-two
# lines and not one of them new in kind -- the machine code copied in, the
# `sockaddr` written beside it, the space installed, the entry into ring 3, and
# the volatile reads that take its answers back. Cloned rather than shared
# because the two probes differ in what they map and where they report, and a
# parameterised one would have been a third thing to get wrong in a path where
# a mistake is a triple fault.
# 1978 for RFC 0058's pair of hosted programs, which prove a poller parked on
# the datagram bell is woken by another program's datagram. Thirty-nine lines
# for two probes, and **less than two of the previous ones**: the mapping,
# copying, entry and report-reading live in one launcher the pair share, because
# they differ only in their code, where it lives, which port they bind and
# whether a second address is written for them. The socket-poll probe was cloned
# from the socket probe and that showed; this one was not.
# 1983 for RFC 0058 Part A's gate: a probe that binds a port and is killed
# holding it, plus the reads that take its two answers back. Five lines, and it
# shares the launcher the pair before it introduced -- the probe differs only in
# its code and where it lives.
# 1989 for RFC 0059's hosted-exec probe: one line in `put_in_probe_page`, the
# `vm::install`, and the `enter_ring3` that every ring 3 probe here ends with.
#
# **It was 2021 first, and the thirty-eight lines were one mistake.** The
# probe's page is built by writing ten things into it, and the first version
# wrapped the whole building block -- three loops and their arithmetic -- in a
# single `unsafe`. Every line inside counts, and none of the arithmetic needed
# to be there. `coding-style.md` §3 asks for the smallest block that can carry
# the obligation rather than the smallest number of blocks; one helper holding
# the copy, called ten times from safe loops, is six lines instead of
# thirty-eight and says exactly what it promises in three arguments.
# 1990 for RFC 0062's `refresh_fs_base_here`: **one line**, the `load_fs_base`
# that the IPI handler performs on the CPU the thread is actually running on.
# It carries the same obligation `load_fs_base`'s other callers do -- a
# user-mode segment base for a thread this CPU is about to return to -- and it
# exists because that register is per CPU and the code that knows the new value
# is running on a different one. Everything around it is safe: the queue is
# taken with `try_lock`, the record is read through a reference, and the guard
# is dropped before the write.
#
# 1991 on 2026-09-02: one line, and unlike the 1991 this file carried for an
# hour yesterday, the reason is real. `sync::first_violation` turns the stored
# `usize` back into the `&'static Location` that `record` put there. It exists
# because CI keeps a failing gate's own line and the indented lines after it,
# and job logs need admin rights even on a public repository -- so run 489's
# genuine lock-ordering violation reached this project as a *count* and nothing
# else, and sat unrecorded until 2026-09-02. The detail is printed by the gate
# now, where CI can see it.
#
# 1993 on 2026-09-05: two lines for RFC 0072 step 1, the PCI inventory --
# `pci::for_each` and `pci::for_each_capability`, each an `unsafe fn` because
# configuration reads require the bootstrap CPU with nothing else driving a
# cycle, which is the condition `virtio::find_nth_of` already states for the
# identical walk. Two lines and not more because the gate said so: the first
# version wrote both closures *inside* their `unsafe` blocks and cost
# twenty-seven lines, of which twenty-five were `println!`. Binding each closure
# first leaves the unsafe scope as the two calls that are actually unsafe. The
# lines could not be avoided -- the calls are unsafe and there is no safe
# wrapper for them -- but their scope could be, and was.
#
# 1994 on 2026-09-05: one line for RFC 0072 step 2's `find_foreign_nic` --
# another `pci::for_each`, the same walk with a different predicate. The BARs it
# reads afterwards cost nothing, because `pci::read32_ecam` is safe; only the
# enumeration is not. One line and not more for the reason the entry above
# gives: the closure is bound before the `unsafe` rather than written inside it.
#
# 1995 on 2026-09-05: one line for RFC 0072 step 2's second half -- the
# `iommu::invalidate_contexts()` that follows attaching a window to a foreign
# NIC. Every other `attach_device` here pays the same line for the same reason,
# stated at each of them: the unit caches context entries, so without the
# invalidation it goes on believing the device has none and drops every request
