unsafe_budget = 1995
# Up thirty-one for RFC 0005 step 9's socket probe -- `ring3_socketeer`, which
# is `ring3_lister` with a `sockaddr_in6` copied in beside its code instead of
# two filenames. The same two blocks every hosted probe has: one
# `copy_nonoverlapping` filling a frame this space owns through the direct
# map, and the `vm::install`/`enter_ring3` pair it ends with.
#
# None of the step's content is in it. `socket`, `bind`, `sendto` and
# `recvfrom` are answered in `bin/linuxd`, and the arithmetic they rest on --
# `parse_endpoint`, `write_endpoint`, `plan_socket` -- is in
# `bhaskix-personality`, which is `forbid(unsafe_code)` and fuzzed. These
# thirty-one lines are the cost of *running* the test.
# Up one for RFC 0044, and it is the same statement moved rather than a new
# kind of authority: `paging::unmap_page` on a root the object itself recorded
# a mapping into. `shared::revoke` has had that line since RFC 0009; taking a
# *lending* back needs it too, and the two cannot share a body because one ends
# in `destroy` and the other must not. Everything the new path decides --
# which holders lost their last name for the object, which mapping slots that
# selects -- is safe code with host tests, and the one unsafe line is the
# instruction that carries the decision out.
# Up thirteen for RFC 0005 step 8's directory probe -- `ring3_lister`, which is
# `ring3_filer` with a second name copied into its page. Two blocks and no new
# kind of authority: one `copy_nonoverlapping` filling a freshly mapped frame
# this space owns through the direct map, and the `vm::install` /
# `enter_ring3` pair every hosted probe ends with. The step's own content --
# `lseek`, `fstat`, `getdents64`, the dirent and stat layouts -- is in
# `bhaskix-personality`, which is `#![forbid(unsafe_code)]`, and in `bin/linuxd`,
# whose count did not move. So the thirteen lines are the cost of *running* the
# test, not of the feature: every decision it exercises is decided in safe code
# a host test holds.
# Up one, and it buys a rule that had never been written down. Every entry into
# ring 3 now goes through `enter_user`, which refuses a thread that is not
# pinned before it can enter the kernel on another CPU's stack -- so there is
# one `unsafe { enter_ring3 }` behind six call sites instead of six loose ones,
# plus the one this adds. The line count is a line worse and the surface is
# five doors narrower.
#
# Down again, from 1125, as the virtqueue moved into a crate at RFC 0014 step
# 5: the kernel's driver no longer writes descriptors or rings by hand. Two
# steps, two reductions, and the second is the one that mattered -- those lines
# existed twice, in two drivers, with nothing checking that they agreed.
#
# 1097 at RFC 0017 step 1: a fault in ring 3 ends its domain instead of halting
# the processor it ran on. Sixteen lines, in two places, and they are worth
# separating because only one of them is new authority.
#
# The first is one statement with a long justification: `enable_interrupts`
# before the faulting thread exits. The interrupt gate cleared `IF` on entry,
# and `sched::exit` halts the CPU when it has nothing else to run -- so leaving
# them off would halt this processor with interrupts disabled, which is exactly
# the behaviour the step exists to remove. It would have turned a fix into the
# bug wearing different clothes, and on a one-CPU machine that is indeed what
# it does.
#
# The rest is the gate: a privilege stack allocated for the CPU the faulting
# program runs on, and installed in the TSS. Both are `unsafe` for the reason
# every stack allocation here is, and both already appear in `ring3_self_test`
# a few hundred lines above. They are duplicated rather than shared **on
# purpose**: a test that borrowed the other test's privilege stack would pass
# or fail on the order the two happened to run in, which is not a property of
# the thing being tested.
#
# What it buys is the first proof in this project that an unprivileged program
# cannot take a processor with it. That was never tested before -- all six
# injected faults came from kernel mode -- and the claim had been false and
# unnoticed since M5.
#
# 1087 at RFC 0017 step 2, which is *down* ten and adds no `unsafe` of its own.
# Owning a domain's threads is ordinary code -- a flag, a wake, and two checks
# on paths that already existed. The ten came back when a static that chose the
# probe's mode was replaced by an entry argument, which shortened the one
# `unsafe` block that reads it.
#
# Ratcheted to the measured figure rather than left at 1097 with slack. A
# budget above the count is that many lines of `unsafe` nobody has to justify,
# which is the opposite of what the number is for.
#
# 1089 at RFC 0017 step 5, and both lines are ones this file already contains
# once: installing an address space, and entering ring 3. They appear again
# because there is now a *second* loader -- `started_program`, which loads an
# image a program supplied rather than one boot code chose.
#
# That difference is the reason the count went up rather than the code being
# shared. The two loaders answer to different callers: one is boot code with a
# file it trusts, the other is a system call with bytes a program handed over.
# The second copies the image before parsing it, refuses one larger than
# `STARTED_IMAGE_MAX`, and ends the thread rather than the machine on every
# failure. Folding them together would mean one of those behaviours applying
# where it does not belong, and the shorter of the two would be the one that
# lost.
#
# Both blocks carry the same `SAFETY:` note as their originals, and it is the
# same argument: `elf::parse` refuses an entry point outside a user-executable
# segment, every segment it accepted was mapped, and the stack address is one
# past user-writable memory in the space just installed.
#
# 1502 at RFC 0031's first security-test arm, 2026-08-19. Ten lines, all of
# them volatile reads of one report frame through the direct map, in
# `personality_self_test`: the five answers a hosted program got when it asked
# for this kernel's own syscall kinds by number, and the word it wrote to say
# it was still alive after the one that is `Exit` natively. They carry the
# same `SAFETY:` argument as the three reads directly above them, which is the
# argument for reading any of this probe's report: the frame belonged to the
# probe's space, it is read before anything reuses it, and a load through the
# direct map of a frame this kernel allocated cannot fault.
#
# 1512 at RFC 0032's supervisor interface, 2026-08-19. Ten lines, both blocks in
# `copy_across`, which moves bytes between a `Memory` object and a domain the
# caller holds a capability to. They are `unsafe` for the reason `elf::load_into`
# is: the destination is a physical frame viewed through the direct map, because
# `uaccess` resolves through `CR3` and can only reach the space that is *loaded*
# -- which for a supervisor is its own, and the wrong one. Each carries the
# bound that makes it sound: the frame came from the target space's own
# `translate` for that page, and the length is clamped to what is left in the
# frame before either copy is issued.
#
# 1514 at RFC 0032 step 3, 2026-08-19. Two lines: `enter_user` for the Linux
# adapter's own thread, which is the same line every service domain's entry
# has and carries the same argument -- the entry is inside a user-executable
# segment the loader accepted, and the stack address is one past user-writable
# memory in the space just installed.
#
# **1588 at RFC 0033 step 10**, and the nine are the `/proc` probe's thread —
# the seventh hosted probe in this file with that shape, and the last one this
# RFC needs.
#
# **`/proc` itself is generated in a crate with a budget of zero.** That is not
# a coincidence: a file whose contents are written where the capabilities are
# is one careless interpolation away from publishing one, and
# `personality::proc` has never seen a capability. Its own test enumerates the
# field names it may publish and fails on any other.
#
# **1579 at RFC 0033 step 9**, and the eleven are the wait probe's thread and
# the read of the adapter's wait record. The sixth hosted probe with that shape.
#
# **`commit_page` added none.** Committing a lazily mapped page of another
# domain's space is the fault handler's own body, called with the space the
# caller found instead of the one `CR3` holds — a refactor of `handle_fault`
# into a lookup and a body, and not a line of new `unsafe` between them.
#
# **1568 at RFC 0033 step 8**, and the eleven lines are the fork probe's
# thread and the read of the adapter's fork record. The fifth hosted probe with
# that shape, and the second assembled by a script rather than counted.
#
# **The fork itself adds none.** An address space created, mapped region by
# region, filled a kilobyte at a time and started -- all of it capability
# invocations from ring 3, dereferencing nothing.
#
# **1557 at RFC 0033 step 7**, and the eleven lines are the pipe probe's
# thread: two mappings, the blob copied in through the direct map, and
# `enter_ring3`. The fourth hosted probe in this file with that shape, and the
# first whose *displacements were computed rather than counted* -- three
# earlier ones had a jump or a `lea` off by one, so this one is a script's
# output and the script patches its own branches.
#
# **1546 at RFC 0033 step 6, and twenty-one lines is what a *file* witness
# costs.** All of them are the file probe's thread and the read of the
# adapter's file record: two pages mapped, a hand-assembled blob and a name
# copied in through the direct map, `enter_ring3`, and the drain of three words
# out of the page `bin/linuxd` writes. Not one of them is in a file path — the
# kernel has no idea a hosted program opened anything, which is the claim.
#
# **1525 at RFC 0033 step 5, and fifteen lines is what an `execve` witness
# costs.** Thirteen are the exec probe's thread — a page mapped, the
# hand-assembled blob copied in through the direct map, and `enter_ring3` — the
# same shape every Linux probe in this file has had since RFC 0005 step 2, and
# for the same reason: a hosted program that tests a boundary has to be built
# by something that is not on the far side of it. Two are the read of the
# adapter's exec record out of the page it shares.
#
# **Nothing in `execve` itself is here.** The domain is created, given an
# address space, mapped, filled and started by `bin/linuxd` through
# capabilities; the kernel's part is one generic method (`MAKE_SPACE`) written
# in safe code over `vm::register_for`.
#
# **1510 at step 10.** One line left and five arrived, and the direction is
# worth reading rather than the number: what left is `futex_word`'s `uaccess`
# read (see below); what arrived is five lines of *self-test*, in the clone
# probe -- the go-words that tell a hosted parent it may park and a hosted
# child it may end the group, and the read of the parent's own "parking"
# announcement. All five touch a report page the probe's own space owns,
# through the direct map, which is the idiom every probe beside them uses.
# The gate they fund is the one that caught a hosted thread unable to die
# while parked in a futex.
#
# **1506 of those, and the last Linux `uaccess` in the kernel, is gone with
# it.** `futex_word` read a hosted process's futex word out of its memory with
# a fault-protected copy; `bin/linuxd` reads the same word through a `Domain`
# capability now, which is the difference the whole refactor is about — the
# nucleus no longer dereferences a pointer on a Linux call's behalf, because
# there are no Linux calls here to have a behalf. One line, and it is the one
# that mattered.
#
# **1507 at step 9, and the three lines are all instrument.** The five calls
# that moved took no `unsafe` with them -- they were scalars and scheduler
# calls, which is why they were the ones left. What was added is the evidence:
# two more `read_volatile`s in the thread probe's report page, for the
# `arch_prctl` answer and the word read back through the base it set, and one
# `write_volatile` telling the clone probe's parent it may call `exit_group`
# now that its numbers have been read. All three are the direct-map idiom
# every probe beside them uses, on a frame the probe's own space owns. A
# budget that rose for a self-test is worth more than one that stayed flat
# with the path ungated -- and the gate is the reason `exit_group` can be
# claimed to end a thread that never asked for anything.
#
# **1504 at step 8, down a third time**: `rt_sigreturn` left, and with it the
# last `uaccess` read the personality had in the nucleus. Three consecutive
# steps, three reductions -- while the machine gained a supervisor interface,
# a fault upcall, a register-frame exchange and a personality that decides
# what a signal means. The number is the argument.
#
# **1507 at step 7, down again**: signal *delivery* left with its two
# `uaccess` copies and its trap-frame writes, and what stayed behind --
# `rt_sigreturn` -- needs one. Two steps, two reductions, while the machine
# gained a fault upcall and a personality that decides what a signal means.
#
# **1512 at step 6, and it went *down* while a subsystem was added.** The
# memory calls left the nucleus with their `uaccess` copies, and what replaced
# them -- handing a fault to ring 3 -- needs exactly one `unsafe` line, the
# `enable_interrupts` before the blocking call, whose argument is in
# `fault.rs`'s own documentation. A personality leaving the kernel takes its
# pointer arithmetic with it, which is the whole point stated as a number.

[features]
# Lets a *host* binary link this crate without inheriting the kernel's global
# allocator, which is backed by physical memory that does not exist off the
# machine. Enabled only by `fuzz/`; a kernel build must never set it.
host = []
