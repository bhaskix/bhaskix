# SPDX-License-Identifier: Apache-2.0
#
# RFC 0091 step 1: the boot set's signature. SLH-DSA-SHA2-128s verification
# and the 128-byte statement `boot.sig` carries -- pure, host-tested against
# NIST's ACVP vectors, and fuzzed. The native loader links it at step 3.
[package]
name = "bhaskix-bootsig"
description = "The boot set's signature: SLH-DSA-SHA2-128s verification and the boot.sig statement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "bhaskix_bootsig"
path = "src/lib.rs"

[dependencies]
bhaskix-sha256 = { path = "../sha256" }

[features]
# Key generation and signing (RFC 0091 step 2), for `bootsign` on the custody
# machine. Off by default, so the loader, which only verifies, never links a
# line of it.
sign = []
# The `bootsign` host tool: signing, plus `std` for files and the operating
# system's randomness. `make bootsign` builds it.
tool = ["sign"]

[[bin]]
name = "bootsign"
path = "src/bin/bootsign.rs"
required-features = ["tool"]

# The tests enable `sign` for themselves, so `cargo test --workspace` (and
# with it `make test-host` and CI) checks the signer against NIST's vectors
# without the feature reaching anything that ships.
[dev-dependencies]
bhaskix-bootsig = { path = ".", features = ["sign", "tool"] }

[lints]
workspace = true

[package.metadata.bhaskix]
# Hashing and comparing public data, and parsing a file at fixed offsets.
# Arithmetic and untrusted input, with no `unsafe` that could be justified.
unsafe_budget = 0
