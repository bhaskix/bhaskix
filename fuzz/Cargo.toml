# Its own workspace on purpose.
#
# The parent workspace builds for `x86_64-unknown-none` and its members are the
# kernel and the things it ships. A fuzz target is a host binary that links
# libFuzzer, so folding it in would make every ordinary `cargo build` drag in a
# nightly-only sanitizer runtime. `cargo fuzz` is run explicitly or not at all.
[package]
name = "bhaskix-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Tarun Kumar Kushwaha"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[package.metadata.bhaskix]
# Zero, and it must stay zero. A fuzz target that needs `unsafe` to reach the
# parser is a fuzz target that can produce its own crashes, and then a finding
# means nothing until you have worked out whose fault it was.
unsafe_budget = 0

[dependencies]
libfuzzer-sys = "0.4"
bhaskix-kernel = { path = "../kernel", features = ["host"] }
bhaskix-service-vfs = { path = "../services/vfs" }
bhaskix-arch-x86-64 = { path = "../arch/x86_64" }
bhaskix-net = { path = "../net" }

[[bin]]
name = "elf_parse"
path = "fuzz_targets/elf_parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true

[workspace]

[[bin]]
name = "ustar_parse"
path = "fuzz_targets/ustar_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dmar_parse"
path = "fuzz_targets/dmar_parse.rs"
test = false
doc = false
bench = false

# RFC 0018 step 1. Four parsers, because they fail differently: framing,
# a fixed-layout packet plus the cache it drives, three lengths that must
# agree plus stateful reassembly, and one optional checksum over a
# pseudo-header. Splitting them keeps a corpus per failure mode rather than
# one corpus whose coverage is dominated by whichever parser is cheapest to
# reach.
[[bin]]
name = "eth_parse"
path = "fuzz_targets/eth_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arp_parse"
path = "fuzz_targets/arp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipv4_parse"
path = "fuzz_targets/ipv4_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udp_parse"
path = "fuzz_targets/udp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "icmp_parse"
path = "fuzz_targets/icmp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp_parse"
path = "fuzz_targets/dhcp_parse.rs"
test = false
doc = false
bench = false

# RFC 0020 step 2, and it is a different shape from the six above. Those parse
# fixed layouts; this one walks an option list whose stride the packet chooses,
# so the failure it is looking for is a loop that does not advance rather than a
# read past the end. Its own corpus, because inputs that reach the walk look
# nothing like the ones that reach a datagram header.
[[bin]]
name = "tcp_parse"
path = "fuzz_targets/tcp_parse.rs"
test = false
doc = false
bench = false

# RFC 0020 step 3, and the only target here whose subject remembers anything.
# The other nine answer one question about one buffer; this one drives a
# sequence of events into a control block that carries state across all of them,
# so what it is searching for is an *order* rather than a malformed input.
[[bin]]
name = "tcp_state"
path = "fuzz_targets/tcp_state.rs"
test = false
doc = false
bench = false
