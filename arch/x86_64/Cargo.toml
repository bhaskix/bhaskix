[package.metadata.bhaskix]
# `arch` is one of the places `unsafe` is permitted (docs/coding-style.md §3):
# port I/O and CPU control instructions cannot be expressed any other way.
#
# Set from measurement, not guesswork. M1 used 88 lines; M2 raised it to 218.
#
# Why the M2 increase could not be avoided: descriptor tables, the interrupt
# entry path, and control-register access have no safe expression. `lgdt`,
# `lidt`, `ltr`, the far return that reloads CS, and the segment loads are all
# raw instructions, and the `BootCell` that holds the tables exists precisely
# to make the single-threaded-boot assumption explicit rather than implicit.
#
# M2-08 raised it again: 218 -> 460, for the APIC, the PIC, MSR and CPUID
# access, and the minimal page mapper. Every one of those is a raw instruction
# or a raw pointer walk with no safe expression -- `rdmsr`, `wrmsr`, `cpuid`,
# `invlpg`, port I/O, and writing page table entries reached through the direct
# map.
#
# Note on the metric: it counts *lines inside* unsafe blocks, so a function
# that wraps its whole body in one block scores much higher than the same code
# split into narrow blocks. That makes the number good for spotting growth and
# poor as an absolute measure of risk. Narrowing the blocks in `apic` and
# `paging` would cut this substantially and is worth doing when they are next
# touched.
# M3 raised it again, 460 -> 570, for the page-table walker: map, unmap,
# translate, address-space creation and teardown are all raw pointer walks
# through tables reached via the direct map, and none of it has a safe
# expression while the table format belongs to the hardware rather than to us.
# 634 at M3-12. The increase is `uaccess` -- walking the exception table from
# two linker-provided symbols, and the copy routines themselves -- plus the
# CR4 writes that enable SMEP and SMAP.
# 713 at M4. The increase is per-CPU descriptor tables, the GS-base per-CPU
# area, and the inter-processor interrupt used for TLB shootdown -- all raw
# instruction or raw pointer work with no safe expression.
unsafe_budget = 780
