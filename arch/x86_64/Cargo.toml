[package.metadata.bhaskix]
# `arch` is one of the places `unsafe` is permitted (docs/coding-style.md §3):
# port I/O and CPU control instructions cannot be expressed any other way.
#
# Set from measurement, not guesswork. M1 used 88 lines; M2 raised it to 218.
#
# Why the M2 increase could not be avoided: descriptor tables, the interrupt
# entry path, and control-register access have no safe expression. `lgdt`,
# `lidt`, `ltr`, the far return that reloads CS, and the segment loads are all
# raw instructions, and the `BootCell` that holds the tables exists precisely
# to make the single-threaded-boot assumption explicit rather than implicit.
#
# M2-08 raised it again: 218 -> 460, for the APIC, the PIC, MSR and CPUID
# access, and the minimal page mapper. Every one of those is a raw instruction
# or a raw pointer walk with no safe expression -- `rdmsr`, `wrmsr`, `cpuid`,
# `invlpg`, port I/O, and writing page table entries reached through the direct
# map.
#
# Note on the metric: it counts *lines inside* unsafe blocks, so a function
# that wraps its whole body in one block scores much higher than the same code
# split into narrow blocks. That makes the number good for spotting growth and
# poor as an absolute measure of risk. Narrowing the blocks in `apic` and
# `paging` would cut this substantially and is worth doing when they are next
# touched.
# M3 raised it again, 460 -> 570, for the page-table walker: map, unmap,
# translate, address-space creation and teardown are all raw pointer walks
# through tables reached via the direct map, and none of it has a safe
# expression while the table format belongs to the hardware rather than to us.
# 634 at M3-12. The increase is `uaccess` -- walking the exception table from
# two linker-provided symbols, and the copy routines themselves -- plus the
# CR4 writes that enable SMEP and SMAP.
# 713 at M4. The increase is per-CPU descriptor tables, the GS-base per-CPU
# area, and the inter-processor interrupt used for TLB shootdown -- all raw
# instruction or raw pointer work with no safe expression.
# 850 at M5-03, the SYSCALL fast path. Every MSR write is unsafe by nature, and
# each is a separate block because each has its own precondition -- "after the
# GDT is loaded", "this CPU's own per-CPU area", "before SCE is set". The entry
# stub itself is assembly, which the counter does not see; what it counts is
# the programming around it, and that is exactly the part a reviewer should be
# able to read one obligation at a time.
# 900 at M6-04, device interrupts. The I/O APIC is a two-register window
# programmed by writing an index and then reading or writing a data port, so
# every register access is a pair of volatile accesses that must not be
# reordered or elided -- there is no safe way to express "this write is how the
# next read is addressed". The ACPI walk adds the rest: each table is borrowed
# from a physical address the firmware named, and each borrow is a separate
# obligation stated where the length it depends on was checked.
# 980 at M6-06, PCI. Configuration space is reached by writing an address
# port and then reading a data port, so every register access is a pair of
# port operations that must happen in that order and must not be elided --
# the same shape as the I/O APIC's window, and just as impossible to express
# safely. The count is dominated by one `unsafe` block per accessor, which is
# deliberate: each states which port pair it drives and why nothing else is
# driving it concurrently.
# 1010 at M6-12, RFC 0012 step 3. The increase is one register window: a
# remapping unit's, reached by volatile reads and writes at offsets the unit
# itself reports. It is the same shape as the I/O APIC's and PCI's -- an
# accessor per register, each stating what it drives -- with one difference
# worth writing down. `GCMD` cannot be read: a write sets the whole enable
# state at once, so there is no read-modify-write and the value last written is
# kept in a shadow. That is why enabling translation is a method on a `&mut`
# rather than a free function, and why the count includes a field nobody else
# needs.
unsafe_budget = 1010
