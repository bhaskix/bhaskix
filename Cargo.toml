# Bhaskix workspace.
#
# Crate members are added as their milestones land (docs/roadmap.md).
# Dependency direction is enforced in CI:
#
#     arch  -> (nothing)
#     mm    -> arch
#     sched -> arch, mm
#     kernel-> arch, mm, sched
#     fs, net, drivers -> kernel   (via the service interface only)
#
# Cycles are a build failure, not a review comment.

[workspace]
resolver = "3"
members = [
    # M1 — docs/roadmap.md
    "abi",
    "boot/handoff",
    "boot/shim",
    "arch/x86_64",
    "kernel",

    # M2-11 (boot-time bump allocator); grows into M3
    "mm",

    # M4
    # "sched",

    # M6
    "fs",
    # "drivers",

    # Phase 2 — M7, RFC 0013. The framework, then one crate per service.
    # A service crate depends on the two above it and on nothing else, which
    # `tools/check-placements.sh` checks against `services.toml`.
    "device",
    "service",
    "service-domain",
    "services/console",
    "services/vfs",

    # Phase 2 — RFC 0018 step 1. Host-testable protocol arithmetic, with no
    # device, no domain and no IPC under it. `netd` and `ipd` are steps 2 and 4.
    "net",

    # Phase 2 — RFC 0021. The system's only source of unpredictability, which it
    # did not have at all until TCP needed one. Depends on nothing, so that the
    # kernel, a ring 3 service and a host test can all reach it.
    "rand",

    # Phase 2 — RFC 0026 step 1. The telemetry plane's arithmetic: the
    # 64-byte event, the schema registry and its build-time hash, and every
    # ring decision as a pure function. Depends on nothing, so the kernel
    # emits through it, `bin/traced` decodes through it, and a host test
    # drives both sides in one process.
    "telemetry",

    # Phase 2 — RFC 0027 step 1. The client side of the network: the
    # exchange shapes, the refusal decoding and the wait discipline that
    # three programs used to hand-roll. Depends on the ABI and nothing
    # else; programs depend on it.
    "sock",

    # Phase 2 — RFC 0028 step 4. The ELF64 parser, out of the kernel and
    # into the leaf layer: one fuzz-hardened copy, reachable from the
    # kernel, the boot loader and the fuzz target alike.
    "elf",

    # Phase 2 — RFC 0030 step 1. The ustar reader, out of the filesystem
    # service by the same argument: the package format is the same subset,
    # and two copies of "what is a well-formed header" would drift.
    "ustar",

    # Phase 2 — RFC 0030 step 1. The package format: the manifest grammar,
    # the archive walk, and SHA-256 as arithmetic. Host-testable, fuzzed,
    # zero unsafe; `mkimage` grows here at step 2 the way `mkfs` lives in
    # `fs`.
    "pkg",
]

# The negative fixture for `tools/check-placements.sh`: a service that reaches
# into the kernel and is *expected* to be rejected. Excluded because it must
# never be built by anything else, and because the check reads it exactly the
# way it reads a real service — through `--manifest-path`, one code path, so
# what the fixture proves is what the check does.
exclude = [
    "tests/fixtures/placement/direct-call",
    # Register blocks that are wrong about themselves. They must *not* compile,
    # and `make gates` asserts that -- so they cannot be workspace members,
    # because a member that never builds is a workspace that never builds.
    "tests/fixtures/registers/overlap",
    "tests/fixtures/registers/overrun",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
# Open decision A1, resolved 2026-08-02 — see docs/rfc/0001-license-apache-2.0.md.
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Kernel builds must not unwind: there is no unwinder, and a panic in the
# nucleus is a denial of service (docs/coding-style.md §4).
[profile.dev]
panic = "abort"
overflow-checks = true
debug = true

[profile.release]
panic = "abort"
overflow-checks = true   # kept ON in release: an integer overflow in a page
                         # table index is worse than the branch it costs.
lto = "fat"
codegen-units = 1
debug = true             # symbols for kernel debugging; stripped from images
