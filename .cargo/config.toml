#
# Build configuration for the Bhaskix kernel.

[build]
# Default to the freestanding target so a plain `cargo build` does the right
# thing. Host unit tests override this with an explicit `--target`; see the
# `test-host` rule in the Makefile.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # Position independent, so the bootloader can slide the kernel image and
    # KASLR is real rather than nominal. The link script's 0xffffffff80000000
    # is a *preferred* base; the loader applies a random offset and fixes up
    # the R_X86_64_RELATIVE entries it finds through PT_DYNAMIC.
    #
    # This is why the exception table stores self-relative offsets rather than
    # absolute addresses: an absolute address in a read-only section needs a
    # dynamic relocation the linker will not emit there.
    "-C", "relocation-model=pic",

    # The `kernel` code model assumes every symbol lives in the top 2 GiB, so
    # the compiler can use 32-bit signed displacements instead of 64-bit
    # absolute addresses. That stays correct under KASLR only because the
    # loader confines the slide to that same 2 GiB window -- a slide outside it
    # would silently truncate displacements rather than fail to link.
    "-C", "code-model=kernel",
]

[alias]
# Convenience wrappers matching the Makefile, for people who prefer cargo.
kbuild = "build --release"
kcheck = "clippy --release -- -D warnings"
