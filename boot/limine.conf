#
# Limine bootloader configuration for the Bhaskix boot image.
#
# Kept minimal on purpose: everything the kernel needs is requested through the
# protocol (see boot/shim/src/limine.rs), not configured here.

timeout: 0

/Bhaskix
    protocol: limine
    path: boot():/boot/bhaskix
    # Passed through to Handoff.cmdline. Empty for now; M2 onward will use it
    # for early debug options.
    cmdline:
