#
# Limine bootloader configuration for the Bhaskix boot image.
#
# Kept minimal on purpose: everything the kernel needs is requested through the
# protocol (see boot/shim/src/limine.rs), not configured here.

timeout: 0

/Bhaskix
    protocol: limine
    path: boot():/boot/bhaskix
    # Passed through to Handoff.cmdline. Empty here: `make iso CMDLINE=...`
    # fills it, and the kernel reads its options in kernel/src/lib.rs.
    cmdline:
    # The initial ramdisk, a ustar archive. Loaded into
    # bootloader-reclaimable memory and handed to the kernel as
    # Handoff.initrd; see boot/shim/src/limine.rs.
    module_path: boot():/boot/initrd.tar
