# SPDX-License-Identifier: Apache-2.0
#
# RFC 0028 step 1: the native UEFI loader's skeleton. The first code that
# runs on a Bhaskix boot, once this lane graduates -- which is exactly why
# it is in this tree, under this tree's rules, with no external crates: the
# firmware bindings are hand-rolled the way boot/shim/src/limine.rs
# hand-rolls Limine, and the empty dependency allowlist holds where it
# matters most.
#
# Not a member of the root workspace: it targets x86_64-unknown-uefi, and a
# workspace member cannot have its own target.
[workspace]

[package]
name = "bhaskixboot"
description = "The native UEFI loader: the machine enters through our own door."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "bhaskixboot"
path = "src/main.rs"

[dependencies]
# The contract the native protocol IS -- the kernel's own Handoff types.
bhaskix-boot = { path = "../handoff" }
# The same fuzz-hardened parser the kernel loads programs with.
bhaskix-elf = { path = "../../elf" }
# RFC 0021's draw, for the KASLR slide. A machine that cannot answer
# boots unslid and says so -- the same policy every consumer holds.
bhaskix-rand = { path = "../../rand" }
# RFC 0089: the events the loader asks the firmware to log, built where a host
# test holds their bytes.
bhaskix-tcglog = { path = "../../tcglog" }
# RFC 0091 link 2: the boot set's statement and its SLH-DSA-SHA2-128s check,
# without the `sign` feature -- the loader verifies and never signs -- and the
# SHA-256 it hashes the three files with.
bhaskix-bootsig = { path = "../../bootsig" }
bhaskix-sha256 = { path = "../../sha256" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 5 — a UEFI loader runs before anything abstracts the machine: two port
# accesses for the serial line, one `hlt` to stop, one long jump into the
# kernel, and one `CPUID` to learn what it is running on.
# 6 on 2026-10-29: one `rdtsc`, RFC 0091 step 3 -- the cost line that times
# hashing the boot set and checking `boot.sig`, calibrated against `Stall`.
asm_budget = 6
# 11, measured, no headroom: the serial port I/O, the signature-checked
# firmware table reads and the console call through them, and the panic
# halt. Grows step by step with the loader, and every growth is a line in
# this comment.
#
# 23 at step 2: the payload path -- HandleProtocol twice, OpenVolume, Open,
# Read and Close through the transcribed tables, each behind a null check
# and each able to refuse with a printed status.
#
# 50 at step 3: the machine's shape -- the configuration-table walk, the
# graphics chain's null-checked hops, the memory-map take welded to the
# exit, and the park. Every new line is a firmware answer read behind a
# check, or the hlt that ends a machine the loader now owns.
#
# 78 at step 5: the world -- page allocation, the buffer views over pages
# the firmware granted, the table pool's zeroing and entries, and the
# handoff block's writes with the fabricated references whose lifetimes
# the reclamation contract states. The decisions -- the parse, the
# relocation walk, the refusals -- stay in bhaskix-elf at budget zero.
#
# 97 at step 6: the jump -- one asm block that never returns: interrupts
# off, EFER.NXE, the world's root into CR3, the kernel's stack, and the
# door with the handoff and the magic in the argument registers.
#
# 103 at step 7's parity fix: the handoff's references are fabricated
# through the direct map instead of identity -- same reads, six more
# lines, because the kernel keeps those references long past the loader's
# identity view and follows them from address spaces with no low half.
# 114 on 2026-08-22: eleven lines for `EFI_SERIAL_IO_PROTOCOL` -- locating it
# and the one call this loader makes through it. Every line is a firmware
# function pointer the type system cannot describe. They buy the removal of a
# worse thing than `unsafe`: writing COM1's registers while the firmware still
# owns the port, which UEFI §12 gives this protocol to avoid.
# 125 on 2026-10-07: eleven lines for `EFI_TCG2_PROTOCOL`, RFC 0089 step 2 --
# locating it and the one call that measures through it, `HashLogExtendEvent`.
# The same shape and size as the serial protocol's eleven: firmware function
# pointers the type system cannot describe. The event they log is built in
# `bhaskix-tcglog` at budget zero.
# 143 on 2026-10-08: eighteen lines for the event log, RFC 0089 step 3 -- the
# `GetEventLog` call, four views of firmware memory sized exactly by the
# firmware's own answer and the header it wrote (never a byte past the last
# entry), the copy into `LoaderCode` pages, and the handoff's slice over that
# copy through the direct map, as the initrd's is. The arithmetic that sizes
# the views is `bhaskix-tcglog`'s, fuzzed, at budget zero.
# 144 on 2026-10-08: one line, the system table read by `peek_map` -- the
# memory map taken before the exit to size the page-table pool from the
# machine (an SR550 with 192 GiB ran the fixed 128-frame pool dry). The
# firmware call itself moved into `take_map`, shared with the exit, and
# was not counted twice; the bound is `bhaskix-boot`'s, at budget zero.
# 148 on 2026-10-11: four lines for the final events table, RFC 0089 step 6 --
# the copy viewed whole to append to it, the table's 16-byte fixed part, and
# each entry's prefix and then the entry its prefix declares, read after the
# exit from ACPI NVS the firmware leaves behind. Sized as the log's last entry
# is, by `bhaskix-tcglog`'s fuzzed arithmetic at budget zero.
# 161 on 2026-10-29: thirteen lines for RFC 0091 step 3. The runtime services
# table read and the one `GetVariable(SecureBoot)` call, whose five arguments
# rustfmt lays one to a line (ten); the boot services read and the `Stall` that
# holds a refusal on screen (two); and `rdtsc` for the cost line (one). The
# check itself is `bhaskix-bootsig`'s, at budget zero.
# 162 on 2026-10-30: the `push 0` in the jump to the kernel, so the kernel is
# entered with the stack a call leaves -- the ABI's alignment, which the jump
# alone had been eight bytes off since the loader was written.
unsafe_budget = 162
