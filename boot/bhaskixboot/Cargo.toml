# SPDX-License-Identifier: Apache-2.0
#
# RFC 0028 step 1: the native UEFI loader's skeleton. The first code that
# runs on a Bhaskix boot, once this lane graduates -- which is exactly why
# it is in this tree, under this tree's rules, with no external crates: the
# firmware bindings are hand-rolled the way boot/shim/src/limine.rs
# hand-rolls Limine, and the empty dependency allowlist holds where it
# matters most.
#
# Not a member of the root workspace: it targets x86_64-unknown-uefi, and a
# workspace member cannot have its own target.
[workspace]

[package]
name = "bhaskixboot"
description = "The native UEFI loader: the machine enters through our own door."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "bhaskixboot"
path = "src/main.rs"

[dependencies]
# The contract the native protocol IS -- the kernel's own Handoff types.
bhaskix-boot = { path = "../handoff" }
# The same fuzz-hardened parser the kernel loads programs with.
bhaskix-elf = { path = "../../elf" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 11, measured, no headroom: the serial port I/O, the signature-checked
# firmware table reads and the console call through them, and the panic
# halt. Grows step by step with the loader, and every growth is a line in
# this comment.
#
# 23 at step 2: the payload path -- HandleProtocol twice, OpenVolume, Open,
# Read and Close through the transcribed tables, each behind a null check
# and each able to refuse with a printed status.
#
# 50 at step 3: the machine's shape -- the configuration-table walk, the
# graphics chain's null-checked hops, the memory-map take welded to the
# exit, and the park. Every new line is a firmware answer read behind a
# check, or the hlt that ends a machine the loader now owns.
#
# 78 at step 5: the world -- page allocation, the buffer views over pages
# the firmware granted, the table pool's zeroing and entries, and the
# handoff block's writes with the fabricated references whose lifetimes
# the reclamation contract states. The decisions -- the parse, the
# relocation walk, the refusals -- stay in bhaskix-elf at budget zero.
#
# 97 at step 6: the jump -- one asm block that never returns: interrupts
# off, EFER.NXE, the world's root into CR3, the kernel's stack, and the
# door with the handoff and the magic in the argument registers.
unsafe_budget = 97
