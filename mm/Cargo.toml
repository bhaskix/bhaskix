[package]
name = "bhaskix-mm"
description = "Memory management for Bhaskix. At M2, the boot-time bump allocator only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "bhaskix_mm"
path = "src/lib.rs"

[dependencies]
bhaskix-boot = { path = "../boot/handoff" }

[lints]
workspace = true

[package.metadata.bhaskix]
# The bump allocator and the buddy allocator are pure arithmetic over the
# memory map and the frame database, and the crate root denies `unsafe` so they
# stay that way.
#
# The slab allocator opts back in, and only it: threading a free list through
# the free objects themselves is the one thing here no safe abstraction can
# express. 15 lines at M3. Test code is excluded from the count -- it does not
# ship, so counting it would distort the number this budget exists to track.
unsafe_budget = 25
