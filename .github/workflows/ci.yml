# SPDX-License-Identifier: Apache-2.0
#
# Bhaskix continuous integration.
#
# Every job invokes a Makefile target rather than repeating its commands.
# That is deliberate: an earlier version spelled the cargo invocations out
# here, drifted from the Makefile, and silently stopped running an entire
# crate's tests. `make` is the single source of truth for what a check *is*;
# this file only decides when to run it and on what.
#
# Ordered cheapest-first, so a formatting mistake fails in seconds rather than
# after a QEMU boot.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- fast feedback ------------------------------------------------------

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain   # honours rust-toolchain.toml
      - run: make fmt

  gates:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      # **Full history, on purpose.** `make gates` checks that
      # `docs/progress.md` still matches the tracker, and that chart dates each
      # RFC from the commit that added its file. `actions/checkout` fetches a
      # single commit by default, so the tool would compute different dates
      # here than anywhere else and the gate would fail for a reason that has
      # nothing to do with the change under test. It did, on `13a7faf`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Containment, vendor strings, SPDX, unsafe budgets, dependencies
        run: make gates

  # --- correctness --------------------------------------------------------

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: make clippy

  test-host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: make test-host

  # --- does it actually boot ---------------------------------------------

  boot:
    name: boot (${{ matrix.firmware }}, ${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
        # Two CPU models on purpose, and it is a real test rather than
        # belt-and-braces: `qemu64` predates x2APIC, so the kernel takes the
        # xAPIC path and has to map the APIC register page itself; `max`
        # exposes x2APIC on QEMU versions that implement it, taking the
        # MSR-addressed path instead. Those are two genuinely different code
        # paths in arch::apic and only one of them can be exercised on any
        # given machine.
        cpu: [qemu64, max]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain

      # **Fails safe, which is why it is `Dir::Cache::archives` and not a
      # third-party action.** A cache miss downloads exactly as before; a hit
      # skips the download and nothing else changes. The packages installed,
      # their versions and the environment the boot sees are untouched -- this
      # moves bytes, not behaviour, which is the only kind of CI speed-up worth
      # having on lanes that exist to catch timing-dependent faults.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: .aptcache
          key: apt-${{ runner.os }}-qemu-xorriso-mtools-ovmf-v1
      - name: Install QEMU, xorriso, OVMF
        run: |
          mkdir -p .aptcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$PWD/.aptcache" qemu-system-x86 xorriso mtools ovmf

      - name: Record the environment
        # Printed because the two failures that matter here -- which APIC path
        # is taken, and whether the firmware image exists -- are decided by the
        # QEMU version and the packaging, not by our code.
        #
        # **Written to a file as well as printed**, because printing it puts it
        # in a log that needs a token to read, and the version is exactly what
        # a failure here needs. It is uploaded with the boot log below.
        run: |
          {
            qemu-system-x86_64 --version
            echo "--- OVMF images present ---"
            ls -la /usr/share/OVMF/ 2>/dev/null || echo "no /usr/share/OVMF"
          } | tee ci-env-${{ matrix.firmware }}-${{ matrix.cpu }}.txt

      # Cached by the branch it tracks. A miss clones as before, so this
      # cannot change which bootloader is used -- only how often it is
      # fetched. `make` still runs, so the built tool is never taken on trust
      # from a cache.
      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: boot/limine/limine
          key: limine-v8.x-binary-${{ runner.os }}-v1
      - name: Fetch Limine
        run: |
          if [ ! -d boot/limine/limine/.git ]; then
            git clone --branch v8.x-binary --depth 1 \
              https://github.com/limine-bootloader/limine.git boot/limine/limine
          fi
          make -C boot/limine/limine

      - name: Build bootable image
        run: make iso

      - name: Boot and assert on serial output
        env:
          QEMU_CPU: ${{ matrix.cpu }}
          # **A limit that costs nothing until it is needed.** 120s was tuned
          # back when waiting for the timeout was the running cost of every
          # case, pass or fail. Polling ended that: `run_until` stops the
          # machine the moment the completion marker lands, so on a healthy
          # boot this number is never reached and raising it is free. It is
          # paid only by a boot that genuinely hangs, and 300s of a hung lane
          # is a cheaper mistake than a red lane on a slow runner.
          #
          # The margin, measured: a boot here takes 32-39s. A runner needing
          # seven times that still passes.
          #
          # **And the runner turned out not to be slower at all.** The harness
          # emits its budget fraction as a `::notice::`, those annotations are
          # readable without a token, and the first answer was `bios` 30.926s
          # and `uefi` 33.927s -- against 30.1-32.6 and 37.1-39.4 here. Same
          # speed; `uefi` is faster there. So the old 120s was being used at
          # about a quarter, the red boot lanes of 2026-08-25 were **not**
          # timeouts, and this larger budget is insurance against a hypothesis
          # that has since been refuted rather than a fix for anything.
          #
          # Kept anyway, because it costs nothing on a passing run -- polling
          # stops the machine at the completion marker -- and is paid only by a
          # boot that genuinely hangs.
          BOOT_TEST_TIMEOUT: 300
          # A known path, so the failure artifact below can carry it. Without
          # this the harness writes to `mktemp` and the one file that says
          # *which gate went red* dies with the runner.
          BHASKIX_BOOT_LOG: boot-${{ matrix.firmware }}-${{ matrix.cpu }}.log
        run: tests/qemu/boot-test.sh ${{ matrix.firmware }}

      - name: Upload the boot log and image on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bhaskix-${{ matrix.firmware }}-${{ matrix.cpu }}-failed
          # **The serial log first, because it is the only thing here that
          # names the failing gate.** This step used to upload the ISO and the
          # kernel binary and not the log, so a red boot lane could be
          # reproduced but not read: `tools/ci-status.sh` could say
          # "boot (bios, max) -- Boot and assert on serial output" and nothing
          # could say which of the 107 assertions that was.
          path: |
            boot-${{ matrix.firmware }}-${{ matrix.cpu }}.log
            ci-env-${{ matrix.firmware }}-${{ matrix.cpu }}.txt
            build/bhaskix.iso
            target/x86_64-unknown-none/release/bhaskix
          retention-days: 7

  shell:
    name: interactive shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain

      # **Fails safe, which is why it is `Dir::Cache::archives` and not a
      # third-party action.** A cache miss downloads exactly as before; a hit
      # skips the download and nothing else changes. The packages installed,
      # their versions and the environment the boot sees are untouched -- this
      # moves bytes, not behaviour, which is the only kind of CI speed-up worth
      # having on lanes that exist to catch timing-dependent faults.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: .aptcache
          key: apt-${{ runner.os }}-qemu-xorriso-mtools-ovmf-v1
      - name: Install QEMU, xorriso
        run: |
          mkdir -p .aptcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$PWD/.aptcache" qemu-system-x86 xorriso mtools

      # Cached by the branch it tracks. A miss clones as before, so this
      # cannot change which bootloader is used -- only how often it is
      # fetched. `make` still runs, so the built tool is never taken on trust
      # from a cache.
      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: boot/limine/limine
          key: limine-v8.x-binary-${{ runner.os }}-v1
      - name: Fetch Limine
        run: |
          if [ ! -d boot/limine/limine/.git ]; then
            git clone --branch v8.x-binary --depth 1 \
              https://github.com/limine-bootloader/limine.git boot/limine/limine
          fi
          make -C boot/limine/limine

      - name: Build bootable image
        run: make iso

      # The only checks here that write to the kernel rather than only reading
      # from it. An input path cannot be tested any other way, and the
      # user-mode shell's whole claim -- that it can do nothing it was not
      # given a capability for -- is a claim about what happens when someone
      # types at it.
      # **One step per mode, and the reason is that logs need a token and step
      # names do not.** `make test-shell` runs `user`, `kernel`, `disk` and
      # `iommu` in sequence and stops at the first failure, so as a single step
      # a red said only "one of four modes died" -- and the mode had to be
      # inferred from the step's *duration* (a 98s failure against a 136-139s
      # pass meant the third one). Four steps put the answer in the job's step
      # names, which `tools/ci-status.sh` reads unauthenticated.
      #
      # This job has gone red at runs 324, 350, 354, 378, 416 and 419 -- about
      # 6% of pushes, four of them long before the interrupt-frame check that
      # was briefly suspected. Each mode boots once, so the rate is consistent
      # with the per-boot faults TRACKER carries open rather than with anything
      # wrong here. Naming the mode is what turns the next one into evidence.
      #
      # **The cost of the split, stated rather than discovered later.** This no
      # longer goes through `make test-shell`, so a fifth mode added to that
      # target would not run here. The target is still what a developer runs;
      # if it grows a mode, this list grows with it.
      - name: Type at the ring 3 shell and assert on its replies
        env:
          # Same reasoning as the boot lane's budget above, and the same
          # correction: this job's first red (run 324) was not reproducible
          # locally, and it reaches its prompt in 13.7-28.3s on CI against
          # 13.4-25.0s here -- **4% of this budget**. It was not a timeout.
          SHELL_TEST_TIMEOUT: 600
        run: tests/qemu/shell-test.sh user

      - name: Type at the kernel shell and assert on its replies
        env:
          SHELL_TEST_TIMEOUT: 600
        run: tests/qemu/shell-test.sh kernel

      - name: Type at a shell whose filesystem came off the disk
        env:
          SHELL_TEST_TIMEOUT: 600
        run: tests/qemu/shell-test.sh disk

      - name: Type at a shell on a machine with the IOMMU on
        env:
          SHELL_TEST_TIMEOUT: 600
        run: tests/qemu/shell-test.sh iommu

  boot-iommu:
    name: boot (iommu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain

      # **Fails safe, which is why it is `Dir::Cache::archives` and not a
      # third-party action.** A cache miss downloads exactly as before; a hit
      # skips the download and nothing else changes. The packages installed,
      # their versions and the environment the boot sees are untouched -- this
      # moves bytes, not behaviour, which is the only kind of CI speed-up worth
      # having on lanes that exist to catch timing-dependent faults.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: .aptcache
          key: apt-${{ runner.os }}-qemu-xorriso-mtools-ovmf-v1
      - name: Install QEMU, xorriso
        run: |
          mkdir -p .aptcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$PWD/.aptcache" qemu-system-x86 xorriso mtools

      - name: Record the environment
        run: |
          {
            qemu-system-x86_64 --version
            echo "--- intel-iommu support ---"
            qemu-system-x86_64 -device help 2>&1 | grep -i intel-iommu || echo "no intel-iommu device"
          } | tee ci-env-iommu.txt

      # Cached by the branch it tracks. A miss clones as before, so this
      # cannot change which bootloader is used -- only how often it is
      # fetched. `make` still runs, so the built tool is never taken on trust
      # from a cache.
      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: boot/limine/limine
          key: limine-v8.x-binary-${{ runner.os }}-v1
      - name: Fetch Limine
        run: |
          if [ ! -d boot/limine/limine/.git ]; then
            git clone --branch v8.x-binary --depth 1 \
              https://github.com/limine-bootloader/limine.git boot/limine/limine
          fi
          make -C boot/limine/limine

      - name: Build bootable image
        run: make iso

      # **The only lane in CI that has a filesystem service**, and that is the
      # whole reason it is here.
      #
      # `bin/fsd` mounts a disk through `bin/blkd`, and the block driver is
      # only given its device once that device has a DMA window -- so no IOMMU
      # means no window, no block service, no filesystem, and every gate that
      # needs one skips. Until this job, CI ran `bios` and `uefi` only, and
      # both of those skip: the hosted file, directory and `execve` gates, the
      # `fs domain` mount, the lending measurement and the disk-backed shell
      # checks were **verified by developers locally and by nothing on a
      # push**. A gate nothing runs is a gate that goes stale without saying
      # so.
      #
      # It also runs the IOMMU itself -- per-device windows, interrupt
      # remapping, and the pass-through decisions RFC 0043 and RFC 0049 made --
      # which `iommu-off` deliberately does not, because turning off a unit
      # that is not there proves nothing.
      #
      # **`max` and not both CPU models.** The boot matrix runs `qemu64` and
      # `max` because they take two different APIC paths; that split is already
      # covered there, on the same kernel. What is uncovered is the filesystem,
      # which does not depend on the APIC model -- so this runs one model, and
      # it is the one every local run of this lane has used.
      #
      # **The flake risk, measured before this was added rather than
      # discovered after.** See TRACKER's entry for the day this job landed:
      # this lane carries gates that no other lane runs, and it also carries
      # the networking gates the other lanes already run. A red here should be
      # read against the open defects in §3 before it is read as a regression.
      - name: Boot with an IOMMU and a filesystem, and assert on serial output
        env:
          QEMU_CPU: max
          BOOT_TEST_TIMEOUT: 300
          BHASKIX_BOOT_LOG: boot-iommu.log
        run: tests/qemu/boot-test.sh iommu

      - name: Upload the boot log and image on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bhaskix-iommu-failed
          path: |
            boot-iommu.log
            ci-env-iommu.txt
            build/bhaskix.iso
            target/x86_64-unknown-none/release/bhaskix
          retention-days: 7

  faults:
    name: fault injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain

      # **Fails safe, which is why it is `Dir::Cache::archives` and not a
      # third-party action.** A cache miss downloads exactly as before; a hit
      # skips the download and nothing else changes. The packages installed,
      # their versions and the environment the boot sees are untouched -- this
      # moves bytes, not behaviour, which is the only kind of CI speed-up worth
      # having on lanes that exist to catch timing-dependent faults.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: .aptcache
          key: apt-${{ runner.os }}-qemu-xorriso-mtools-ovmf-v1
      - name: Install QEMU, xorriso
        run: |
          mkdir -p .aptcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$PWD/.aptcache" qemu-system-x86 xorriso mtools

      # Cached by the branch it tracks. A miss clones as before, so this
      # cannot change which bootloader is used -- only how often it is
      # fetched. `make` still runs, so the built tool is never taken on trust
      # from a cache.
      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: boot/limine/limine
          key: limine-v8.x-binary-${{ runner.os }}-v1
      - name: Fetch Limine
        run: |
          if [ ! -d boot/limine/limine/.git ]; then
            git clone --branch v8.x-binary --depth 1 \
              https://github.com/limine-bootloader/limine.git boot/limine/limine
          fi
          make -C boot/limine/limine

      - name: Every exception reports rather than triple-faulting
        env:
          # Seven machines booted in sequence, each waiting for one exception
          # to be reported. Same reasoning as the boot lane's budget above.
          FAULT_TEST_TIMEOUT: 300
        run: make test-faults
