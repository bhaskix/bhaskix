# SPDX-License-Identifier: Apache-2.0
#
# Bhaskix continuous integration.
#
# Every job invokes a Makefile target rather than repeating its commands.
# That is deliberate: an earlier version spelled the cargo invocations out
# here, drifted from the Makefile, and silently stopped running an entire
# crate's tests. `make` is the single source of truth for what a check *is*;
# this file only decides when to run it and on what.
#
# Ordered cheapest-first, so a formatting mistake fails in seconds rather than
# after a QEMU boot.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- fast feedback ------------------------------------------------------

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain   # honours rust-toolchain.toml
      - run: make fmt

  gates:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      # **Full history, on purpose.** `make gates` checks that
      # `docs/progress.md` still matches the tracker, and that chart dates each
      # RFC from the commit that added its file. `actions/checkout` fetches a
      # single commit by default, so the tool would compute different dates
      # here than anywhere else and the gate would fail for a reason that has
      # nothing to do with the change under test. It did, on `13a7faf`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Containment, vendor strings, SPDX, unsafe budgets, dependencies
        run: make gates

  # --- correctness --------------------------------------------------------

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make clippy

  test-host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make test-host

  # --- does it actually boot ---------------------------------------------

  boot:
    name: boot (${{ matrix.firmware }}, ${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
        # Two CPU models on purpose, and it is a real test rather than
        # belt-and-braces: `qemu64` predates x2APIC, so the kernel takes the
        # xAPIC path and has to map the APIC register page itself; `max`
        # exposes x2APIC on QEMU versions that implement it, taking the
        # MSR-addressed path instead. Those are two genuinely different code
        # paths in arch::apic and only one of them can be exercised on any
        # given machine.
        cpu: [qemu64, max]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain

      - name: Install QEMU, xorriso, OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools ovmf

      - name: Record the environment
        # Printed because the two failures that matter here -- which APIC path
        # is taken, and whether the firmware image exists -- are decided by the
        # QEMU version and the packaging, not by our code.
        #
        # **Written to a file as well as printed**, because printing it puts it
        # in a log that needs a token to read, and the version is exactly what
        # a failure here needs. It is uploaded with the boot log below.
        run: |
          {
            qemu-system-x86_64 --version
            echo "--- OVMF images present ---"
            ls -la /usr/share/OVMF/ 2>/dev/null || echo "no /usr/share/OVMF"
          } | tee ci-env-${{ matrix.firmware }}-${{ matrix.cpu }}.txt

      - name: Fetch Limine
        run: |
          git clone --branch v8.x-binary --depth 1 \
            https://github.com/limine-bootloader/limine.git boot/limine/limine
          make -C boot/limine/limine

      - name: Build bootable image
        run: make iso

      - name: Boot and assert on serial output
        env:
          QEMU_CPU: ${{ matrix.cpu }}
          # **A limit that costs nothing until it is needed.** 120s was tuned
          # back when waiting for the timeout was the running cost of every
          # case, pass or fail. Polling ended that: `run_until` stops the
          # machine the moment the completion marker lands, so on a healthy
          # boot this number is never reached and raising it is free. It is
          # paid only by a boot that genuinely hangs, and 300s of a hung lane
          # is a cheaper mistake than a red lane on a slow runner.
          #
          # The margin, measured: a boot here takes 32-39s. A runner needing
          # seven times that still passes.
          #
          # **And the runner turned out not to be slower at all.** The harness
          # emits its budget fraction as a `::notice::`, those annotations are
          # readable without a token, and the first answer was `bios` 30.926s
          # and `uefi` 33.927s -- against 30.1-32.6 and 37.1-39.4 here. Same
          # speed; `uefi` is faster there. So the old 120s was being used at
          # about a quarter, the red boot lanes of 2026-08-25 were **not**
          # timeouts, and this larger budget is insurance against a hypothesis
          # that has since been refuted rather than a fix for anything.
          #
          # Kept anyway, because it costs nothing on a passing run -- polling
          # stops the machine at the completion marker -- and is paid only by a
          # boot that genuinely hangs.
          BOOT_TEST_TIMEOUT: 300
          # A known path, so the failure artifact below can carry it. Without
          # this the harness writes to `mktemp` and the one file that says
          # *which gate went red* dies with the runner.
          BHASKIX_BOOT_LOG: boot-${{ matrix.firmware }}-${{ matrix.cpu }}.log
        run: tests/qemu/boot-test.sh ${{ matrix.firmware }}

      - name: Upload the boot log and image on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bhaskix-${{ matrix.firmware }}-${{ matrix.cpu }}-failed
          # **The serial log first, because it is the only thing here that
          # names the failing gate.** This step used to upload the ISO and the
          # kernel binary and not the log, so a red boot lane could be
          # reproduced but not read: `tools/ci-status.sh` could say
          # "boot (bios, max) -- Boot and assert on serial output" and nothing
          # could say which of the 107 assertions that was.
          path: |
            boot-${{ matrix.firmware }}-${{ matrix.cpu }}.log
            ci-env-${{ matrix.firmware }}-${{ matrix.cpu }}.txt
            build/bhaskix.iso
            target/x86_64-unknown-none/release/bhaskix
          retention-days: 7

  shell:
    name: interactive shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain

      - name: Install QEMU, xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools

      - name: Fetch Limine
        run: |
          git clone --branch v8.x-binary --depth 1 \
            https://github.com/limine-bootloader/limine.git boot/limine/limine
          make -C boot/limine/limine

      - name: Build bootable image
        run: make iso

      # The only checks here that write to the kernel rather than only reading
      # from it. An input path cannot be tested any other way, and the
      # user-mode shell's whole claim -- that it can do nothing it was not
      # given a capability for -- is a claim about what happens when someone
      # types at it.
      - name: Type at both shells and assert on their replies
        env:
          # Same reasoning as the boot lane's budget above, and the same
          # correction: this job went red once (run 324) without being
          # reproducible locally, and it reaches its prompt in 13.7-28.3s on CI
          # against 13.4-25.0s here -- **4% of this budget**. Whatever run 324
          # was, it was not a timeout.
          SHELL_TEST_TIMEOUT: 600
        run: make test-shell

  faults:
    name: fault injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain

      - name: Install QEMU, xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools

      - name: Fetch Limine
        run: |
          git clone --branch v8.x-binary --depth 1 \
            https://github.com/limine-bootloader/limine.git boot/limine/limine
          make -C boot/limine/limine

      - name: Every exception reports rather than triple-faulting
        env:
          # Seven machines booted in sequence, each waiting for one exception
          # to be reported. Same reasoning as the boot lane's budget above.
          FAULT_TEST_TIMEOUT: 300
        run: make test-faults
