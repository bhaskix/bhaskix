# SPDX-License-Identifier: Apache-2.0
#
# The TCP demonstration client: the first program to open a connection the
# way every program will -- rings it owns, handed across CONNECT.
#
# Not a member of the root workspace, for the reason user/netd/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
[workspace]

[package]
name = "bhaskix-user-tcpc"
description = "The TCP demonstration client, supplying its own rings."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "tcpc"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-sock = { path = "../../sock" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 2 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it.
asm_budget = 2
# 31, measured, no headroom: the syscall block, the report-page writes, the
# deliberate ud2 in the panic handler, the payload written into this
# program's own send ring and the echo read back out of its own receive
# ring -- and, since RFC 0020 step 5, the inbound echo copied between the
# listener's pair, plus a startup touch of every ring so a mapping that did
# not take faults beside the attach that claimed it did, not deep in the
# serve. Owning four rings is the whole point.
#
# 45 at the memory-side wait: the awaited byte is read out of this
# program's own receive ring -- one volatile read in the wait loop that
# replaced three IPC calls per iteration, and the whole point of the
# change.
# 12 since RFC 0027 step 4: the syscall stub, the counter read, the
# memory-wait's volatile poll and every ring access moved into
# bhaskix-sock, reviewed once there. What remains is the panic ud2 and
# the report-page writes.
unsafe_budget = 12
