# SPDX-License-Identifier: Apache-2.0
#
# The protocol service, in a domain with no device.
#
# Not a member of the root workspace, for the reason user/netd/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# It depends on `bhaskix-net`, and it is the program that may: it holds no
# device, no DMA window and no interrupt, so a parser bug here cannot be turned
# into a device pointed anywhere. That asymmetry is the whole argument for the
# two-domain split, and it is visible in these two manifests.
[workspace]

[package]
name = "bhaskix-user-ipd"
description = "The protocol service, in a domain with no device."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "ipd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
# RFC 0018 step 4a. The first program to link the protocol code, and the only
# one that may: it holds no device, no DMA window and no interrupt, so a parser
# bug here cannot be turned into hardware pointed anywhere. `user/netd` is
# deliberately without this dependency and the two manifests together are what
# the two-domain split looks like from the build system.
bhaskix-net = { path = "../../net" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 4 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the ring accesses and the cycle counter it measures with.
asm_budget = 4
# 50, measured. A fifth of either driver's, and that is the point rather than a
# coincidence: this program touches two mappings and no hardware at all. Every
# line of it is a copy out of a region another domain writes, or a store into
# the page it reports through -- there is no device register anywhere in it.
# 87 at step 4a: writing into the return ring, and reading the configuration
# page. Still a third of either driver's, and still not a device register
# anywhere in it.
# 105 at RFC 0018 step 5: the `receive` system call this program needed to
# become a service. One `asm!` block, and its operand list is most of the count
# -- the kernel writes the whole message frame back, so every argument register
# has to be declared as an output.
# 113 at step 6: the report page is now rewritten while serving, and the ring's
# own head is read volatile to report it. The counters froze the moment serving
# began, which read exactly like a service that had stopped working.
# 114 at RFC 0018 step 7: the ring copies are counted now, which is what turned
# the RFC's "two copies per packet" from a claim into 1.99 measured.
# 131 at RFC 0020 step 4: the forward and back rings to bin/tcpd -- two more
# regions another domain shares, read and written through the same one pair of
# copy routines as before, which is why seventeen lines buys two rings.
# Nine more at the pipeline attribution: the rdtsc read and the stamp-once
# report words for the first data segment out and in.
# 131 after RFC 0026 step 5 retired the pipeline stamps: stamp_once and
# its rdtsc were nine lines of unsafe this program no longer contains.
# 136 at RFC 0029 step 3: the second family's five sends and receives --
# each the same shape as its v4 twin (the frame into the return ring, the
# config and ring reads), no new kind of unsafe, five more lines of it.
# 137 at step 4: the v6 datagram send from serve, the same DRAIN-and-ring
# shape the v4 SEND_TO pays.
# 161 at step 5: forward_tcp6's ring writes and doorbell (the v4 forward's
# shape, second record format), and the back ring's v6 arm -- the loopback
# reinjection and the routed send. Every line a twin of an existing one.
# 156 on 2026-08-24, and **not one unsafe operation was deleted**: the
# budget check was over-counting by 5 lines here. It took a whole line's
# brace balance, so `if let Some(x) = unsafe { f() } {` read as still-open and
# charged the outer block's body to this crate. See the changelog; the
# scanner now walks from the block's own brace and has a self-test.
unsafe_budget = 156