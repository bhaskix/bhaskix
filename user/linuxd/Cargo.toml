# SPDX-License-Identifier: Apache-2.0
#
# The Linux personality, in a domain of its own.
#
# [RFC 0031](../../docs/rfc/0031-linux-compatibility-as-an-adapter.md) says
# compatibility is an *adapter above* Bhaskix services and never a reason to
# reproduce Linux kernel architecture inside Bhaskix;
# [RFC 0005](../../docs/rfc/0005-linux-abi-compatibility.md) has said since it
# was drafted that this belongs in a service domain and not the nucleus,
# because it is a parser for ~300 system calls whose pointer and length
# arguments come from the process being contained. This crate is where that
# finally becomes true, one call at a time.
#
# Its own workspace, as every user program is: these crates need their own
# code-generation settings, which a workspace member cannot have.
[workspace]

[package]
name = "bhaskix-user-linuxd"
description = "The Linux personality: a translator in ring 3, holding no authority a native program could not be given."
version = "0.1.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "linuxd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
# The half of the personality that needs no machine: what each system call's
# arguments mean, as pure functions over bytes. Host-tested, zero `unsafe`, and
# **unchanged by this move** -- which is the point of having kept it separate
# while the rest of the personality was in the kernel.
bhaskix-personality = { path = "../../personality" }
# `RDRAND` and the `CPUID` that detects it, for a hosted process's `mmap` base
# -- security.md §1 gap 3. Unprivileged, so a ring 3 program draws for itself
# and holds nothing extra to do it: RFC 0021's finding, and why there is no
# capability here to ask for.
bhaskix-rand = { path = "../../rand" }
# The cycle counter, for RFC 0036 step 2's measurement. Taken from here rather
# than written locally: `bhaskix-sock` owns that read already, written once so
# it is not copied, and an `rdtsc` added here cost twelve `unsafe` lines in the
# program `security.md` §1 calls the largest concentration of authority in the
# system. The exact budget said so before the measurement was even taken.
bhaskix-sock = { path = "../../sock" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 3 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the syscall stub the adapter answers foreign calls through.
asm_budget = 3
# The syscall stub's one block, and the four stores that write one trace
# record into a page this program mapped from an object it holds.
#
# **The hosted process's memory is still reached through capabilities rather
# than through addresses** -- which is RFC 0032's whole shape and the reason
# this budget stays small while the personality grows. The nine lines added at
# step 5 touch this program's *own* page, at an address it chose, whose frames
# came from its own object; not one of them names anything belonging to a
# process it hosts.
#
# 30 at step 6, and the same sentence still holds: two more stores, recording
# that a fault was handed over, into the same page this program owns. The
# faulting process's registers are *not* touched through a pointer -- they
# arrive in a slot of a shared object and go back the same way, which is why a
# module that decides what a fault means costs this program five lines and no
# new authority.
#
# 42 at step 7, when signal delivery itself moved here. Twelve more lines, and
# every one of them reads or writes **this program's own two pages**: the
# scratch area a copy stages through, and the fault slot a register image
# arrives in. A hosted process's memory is still reached only by asking the
# kernel, through a capability, by naming an object -- so the program that now
# decides what a `SIGSEGV` means holds one endpoint, two pages, and a handle to
# each domain it hosts.
# 44 at step 10, and the two lines are the futex table's: one borrow of the
# sleeper array and one of the arrival counter, both `static mut` in a program
# with one thread — the same shape and the same justification as the signal
# dispositions above, which is that the kernel gives a server exactly one
# outstanding reply, so there is no second caller inside these functions and a
# lock here would be a lock nothing can contend.
#
# **The futex that arrived with them reads a hosted process's memory through a
# capability, not a pointer**, which is why the last and most dangerous Linux
# call to move costs two lines about this program's own arrays and none about
# anybody else's memory.
# 46 at RFC 0033 step 3, and the two lines are one table's borrow each way.
# The kernel used to *compute* where this program's handle for a hosted domain
# lived -- `32 + domain id`, which reserved half a CSpace against a machine
# running two hosted programs -- and now allocates a slot and says which. The
# saying is a message, and remembering it is a `static mut` read and written
# by the same single thread as every other table here.
#
# The trade is a slot count: 32 slots reserved by arithmetic became one slot
# per domain that actually exists, in exchange for two lines of `unsafe` and a
# message per hosted domain per boot.
# 85 at RFC 0033 step 9. Two lines write the wait record, and six are borrows
# of the process table and the waiter list that `wait4` needs: to collect a
# zombie, to park a parent, and to wake it when a child ends.
#
# **A status is now recorded where it is known**, which is the call that
# carries it — `exit_group`'s own argument, and the signal number on the fault
# path. The invented zero this replaced was a lie with no reader until step 9
# gave it one.
#
# 77 at RFC 0033 step 8. Two lines write the fork record the kernel reads back,
# and three are borrows of the process table that `fork` needs to admit a child
# and copy a parent's region list into it.
#
# **The copy costs nothing here.** Every byte of a forked address space moves
# through `COPY_IN` and `COPY_OUT` on a `Domain` capability -- two invocations
# per kilobyte, and not one dereference of anybody's memory.
#
# 72 at RFC 0033 step 7, and the six lines are borrows of two new tables: the
# pipes themselves and the record of who is parked on each. A pipe is a ring
# buffer in this program -- both its ends belong to processes this program
# serves, so joining them needs no authority it does not hold, and the moment
# one became an `Endpoint` the kernel would be holding state for a dialect it
# does not interpret.
#
# 66 at RFC 0033 step 6, and the ten lines are two borrows and one page. Three
# write the file record the kernel reads back, one is the read of a lent page
# **of the filesystem service's own cache** -- mapped read-only into this
# program's space, which is how forty bytes reach a hosted program without any
# copy through a message -- and the rest are the table borrows `open`, `close`
# and `dup` need.
#
# **The authority did not grow with them.** A directory capability was granted
# by the kernel; everything this program does with it is an invocation, and the
# only pointer it dereferences is a page it was lent and one it owns.
#
# 56 at RFC 0033 step 5. Six lines, and every one of them is this program's own
# page: three write the exec record the kernel reads back, one reads the
# incarnation table, and two are the borrows the process table needed for
# `execve` to move a record from one domain to another.
#
# **The `execve` itself adds none.** A domain is created, given an address
# space, mapped, filled and started entirely through capability invocations --
# the largest thing this program has ever done to another domain, and it costs
# no `unsafe` at all, because none of it dereferences anything.
#
# 50 at RFC 0033 step 4, and the four lines are the process table's borrows:
# the table itself read and written, and the per-domain incarnation counter the
# same way. **The identity of every hosted process now lives in this program**,
# which is the whole of RFC 0033 -- and it costs four lines of `static mut`
# borrow in a single-threaded server, and no new authority at all: a pid is a
# number, and the record holds handles this program already held.
# 72, and **exact**: see `unsafe_budget_exact` below. 85 until 2026-08-21, when
# twenty repetitions of `&mut` to a `static mut` became eight accessors -- one
# per table, each making the single-threaded promise once instead of restating
# it wherever a table was wanted. Thirteen lines went with them and no behaviour
# changed.
# 76 as of 2026-08-21: 72 plus the four lines of the supervised-copy
# measurement's record write (RFC 0036 step 2). **Raised deliberately, which is
# the whole point of the line below.** A first attempt wrote `rdtsc` here too
# and the number went to 84; taking the counter from `bhaskix-sock`, which owns
# that read already, brought it back to 76. The gate reported both, before
# either was committed.
unsafe_budget = 78
# Up two for RFC 0044's measurement, and both are the same statement this
# program already makes a dozen times: a volatile read and a volatile write
# into the report page it mapped from its own object, at an offset the
# `personality` crate asserts is before the scratch area. No new authority, no
# new page, and no `rdtsc` written here -- the counter comes from
# `bhaskix-sock`, for the reason the supervised-copy measurement gives: adding
# the instruction locally cost twelve unsafe lines in the most
# authority-concentrated program in the system, and the exact budget said so
# immediately.
# **This crate's number is a cap, not a ceiling.** It must equal the count, so
# the build fails if this program's `unsafe` shrinks *or* grows without somebody
# editing this line. `bin/linuxd` is the largest concentration of authority in
# the system -- `security.md` §1's T11 note enumerates what it holds -- and its
# budget went 42 to 85 in one day while RFC 0033 was built. The reassessment of
# 2026-08-20 named that as gap 2 and observed the honest thing: "the
# concentration point" is a property with no completion state, so what is
# actionable is the number, and a number with headroom is a number nobody is
# watching.
unsafe_budget_exact = true
