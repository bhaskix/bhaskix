# SPDX-License-Identifier: Apache-2.0
#
# The Linux personality, in a domain of its own.
#
# [RFC 0031](../../docs/rfc/0031-linux-compatibility-as-an-adapter.md) says
# compatibility is an *adapter above* Bhaskix services and never a reason to
# reproduce Linux kernel architecture inside Bhaskix;
# [RFC 0005](../../docs/rfc/0005-linux-abi-compatibility.md) has said since it
# was drafted that this belongs in a service domain and not the nucleus,
# because it is a parser for ~300 system calls whose pointer and length
# arguments come from the process being contained. This crate is where that
# finally becomes true, one call at a time.
#
# Its own workspace, as every user program is: these crates need their own
# code-generation settings, which a workspace member cannot have.
[workspace]

[package]
name = "bhaskix-user-linuxd"
description = "The Linux personality: a translator in ring 3, holding no authority a native program could not be given."
version = "0.1.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "linuxd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
# The half of the personality that needs no machine: what each system call's
# arguments mean, as pure functions over bytes. Host-tested, zero `unsafe`, and
# **unchanged by this move** -- which is the point of having kept it separate
# while the rest of the personality was in the kernel.
bhaskix-personality = { path = "../../personality" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# The syscall stub's one block, and the four stores that write one trace
# record into a page this program mapped from an object it holds.
#
# **The hosted process's memory is still reached through capabilities rather
# than through addresses** -- which is RFC 0032's whole shape and the reason
# this budget stays small while the personality grows. The nine lines added at
# step 5 touch this program's *own* page, at an address it chose, whose frames
# came from its own object; not one of them names anything belonging to a
# process it hosts.
#
# 30 at step 6, and the same sentence still holds: two more stores, recording
# that a fault was handed over, into the same page this program owns. The
# faulting process's registers are *not* touched through a pointer -- they
# arrive in a slot of a shared object and go back the same way, which is why a
# module that decides what a fault means costs this program five lines and no
# new authority.
#
# 42 at step 7, when signal delivery itself moved here. Twelve more lines, and
# every one of them reads or writes **this program's own two pages**: the
# scratch area a copy stages through, and the fault slot a register image
# arrives in. A hosted process's memory is still reached only by asking the
# kernel, through a capability, by naming an object -- so the program that now
# decides what a `SIGSEGV` means holds one endpoint, two pages, and a handle to
# each domain it hosts.
# 44 at step 10, and the two lines are the futex table's: one borrow of the
# sleeper array and one of the arrival counter, both `static mut` in a program
# with one thread — the same shape and the same justification as the signal
# dispositions above, which is that the kernel gives a server exactly one
# outstanding reply, so there is no second caller inside these functions and a
# lock here would be a lock nothing can contend.
#
# **The futex that arrived with them reads a hosted process's memory through a
# capability, not a pointer**, which is why the last and most dangerous Linux
# call to move costs two lines about this program's own arrays and none about
# anybody else's memory.
# 46 at RFC 0033 step 3, and the two lines are one table's borrow each way.
# The kernel used to *compute* where this program's handle for a hosted domain
# lived -- `32 + domain id`, which reserved half a CSpace against a machine
# running two hosted programs -- and now allocates a slot and says which. The
# saying is a message, and remembering it is a `static mut` read and written
# by the same single thread as every other table here.
#
# The trade is a slot count: 32 slots reserved by arithmetic became one slot
# per domain that actually exists, in exchange for two lines of `unsafe` and a
# message per hosted domain per boot.
# 56 at RFC 0033 step 5. Six lines, and every one of them is this program's own
# page: three write the exec record the kernel reads back, one reads the
# incarnation table, and two are the borrows the process table needed for
# `execve` to move a record from one domain to another.
#
# **The `execve` itself adds none.** A domain is created, given an address
# space, mapped, filled and started entirely through capability invocations --
# the largest thing this program has ever done to another domain, and it costs
# no `unsafe` at all, because none of it dereferences anything.
#
# 50 at RFC 0033 step 4, and the four lines are the process table's borrows:
# the table itself read and written, and the per-domain incarnation counter the
# same way. **The identity of every hosted process now lives in this program**,
# which is the whole of RFC 0033 -- and it costs four lines of `static mut`
# borrow in a single-threaded server, and no new authority at all: a pid is a
# number, and the record holds handles this program already held.
unsafe_budget = 56
