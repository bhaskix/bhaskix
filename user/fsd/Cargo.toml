# SPDX-License-Identifier: Apache-2.0
#
# The filesystem, placed in its own domain.
#
# Not a member of the root workspace, for the reason user/shell/Cargo.toml
# gives: it needs its own code model and its own linker script, and a
# workspace member cannot have its own `rustflags`.
#
# Unlike the block driver, this **is** the same code the kernel runs.
# `bhaskix-fs` has never depended on the kernel -- it was written against a
# `Store` and a `Pages` because RFC 0015 step 6 said a filesystem on a disk
# cannot be handed its own bytes -- so placing it here needed no filesystem
# code at all. What this crate supplies is the other half: a `Store` made of
# system calls.
[workspace]

[package]
name = "bhaskix-user-fsd"
description = "The filesystem in a domain of its own, reading through the block service."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "fsd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-fs = { path = "../../fs" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 4 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the syscall stub and the page accesses a filesystem service makes.
asm_budget = 4
# 55 at RFC 0030 step 3 (2026-08-18): two more lines for the bulk page
# viewed read-only in WRITE_FROM -- the same page, the same promise, the
# read direction.
unsafe_budget = 55
#
# Up three for the comment on `rsi`: the `unsafe` counter counts lines
# inside an `unsafe` block, and an explanation of why a register is declared
# the way it is lives inside one. Paying three lines to say why is the right
# trade -- the thing it explains cost this project a bug once already.
# Small, and it should stay small. Everything this program does to a filesystem
# is safe code in `bhaskix-fs`; the `unsafe` here is the system call
# convention, the entry point, and the places that read and write pages the
# kernel mapped for it. A filesystem service whose `unsafe` count grew would be
# one that had started doing its own parsing.
#
# Up from 40 for the receive side: a second `asm!` block whose operand list is
# most of its length, and the breadcrumb that says how far a run got. A program
# that answers has one more way in than one that only asks.
