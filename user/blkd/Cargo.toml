# SPDX-License-Identifier: Apache-2.0
#
# The block driver, placed in its own domain.
#
# Not a member of the root workspace, for the reason user/shell/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# Unlike the service placements, this is not the same code the kernel runs.
# The kernel's virtio driver stays where it is, driving the first device; this
# one drives the second, and the two share only the specification. That is the
# honest arrangement for a driver: what would be shared is the queue protocol,
# and the queue protocol is the part a domain must own.
[workspace]

[package]
name = "bhaskix-user-blkd"
description = "The block driver in a domain of its own."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "blkd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
unsafe_budget = 200
# 166 lines, and a driver is mostly `unsafe` because a driver is mostly
# registers and rings: every access is a volatile read or write of a mapping
# the kernel made on request, and every descriptor is a store into memory a
# device will read.
#
# What matters is not the count but the reach. None of it can touch anything
# this domain was not given: three pages of registers, four of its own memory,
# and a device that translates through a page table of its own. A wild pointer
# faults in ring 3 and takes the driver down; the same mistake in a kernel
# driver takes the machine. That is the trade this placement makes, and the
# number going up is what it looks like from here.
