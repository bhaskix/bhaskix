# SPDX-License-Identifier: Apache-2.0
#
# The telemetry plane's first consumer -- RFC 0026 steps 3 and 4. It holds
# exactly the two authorities the RFC names: the rings, read-only, and the
# tails, read-write; everything it knows about their contents comes from
# `bhaskix-telemetry`, the same arithmetic the kernel emitted through.
#
# Not a member of the root workspace, for the reason user/netd/Cargo.toml
# gives: it needs its own code model and its own linker script, and a
# workspace member cannot have its own `rustflags`.
[workspace]

[package]
name = "bhaskix-user-traced"
description = "The telemetry reader: drains the per-CPU rings through capabilities and proves the round trip."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "traced"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-telemetry = { path = "../../telemetry" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 4 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the ring reads a telemetry consumer performs directly.
asm_budget = 4
# 24, measured, no headroom: the syscall block, rdtsc for the deadline, the
# report-page writes, the deliberate ud2 in the panic handler, and the
# volatile reads of memory this
# program mapped itself -- ring headers, slots, and its own tail words. Every
# decision about those bytes is bhaskix-telemetry's safe arithmetic; the
# unsafe here is the loads.
unsafe_budget = 24
