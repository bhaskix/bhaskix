# SPDX-License-Identifier: Apache-2.0
#
# The user-mode shell.
#
# Not a member of the root workspace, for the reasons user/probe/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# Its one dependency is the ABI, which is what an unprivileged program is
# allowed to know about the kernel: six system call numbers, a message layout,
# and the methods two services answer. Nothing else.
[workspace]

[package]
name = "bhaskix-user-shell"
description = "A shell that runs in ring 3 and asks for everything it does."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "shell"
path = "src/main.rs"

[dependencies]
bhaskix-pkg = { path = "../../pkg" }
bhaskix-abi = { path = "../../abi" }

[package.metadata.bhaskix]
# 4 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the syscall stub it does not take from `bhaskix-sock`.
asm_budget = 4
# `unsafe` in an unprivileged program is always a promise about something the
# kernel did, and the promise is only as good as the capability behind it.
# That is why this number is watched at all: a program with no authority has
# no pointer worth dereferencing, so every block here should name the
# capability it is standing on.
#
# Six blocks, and what each one rests on:
#
#   1. The `syscall` instruction and its operand list -- register clobbers no
#      safe wrapper can express. Includes a comment explaining why `rsi` is an
#      in-out rather than an input; the counter counts lines, not blocks.
#   2. The `ud2` a panic ends at.
#   3. A read of ordinary memory this program holds a Memory capability for.
#   4. A read of a page of device registers, likewise.
#   5. and 6. Two reads of the page the filesystem service lent -- RFC 0016
#      step 5. These are the first blocks here that read memory belonging to
#      *another program*, and so the first whose promise is not simply "the
#      kernel mapped it" but "the kernel mapped it no stronger than the lender
#      itself held it". That second half is not a comment; it is watched by
#      the gate `a lent page is no stronger than the service's own`, which
#      fails if the mapping ever arrives writable.
#
# A seventh block would need a reason these six have.
# 32 at step 5: the socket demonstration, which maps a page and reads what a
# service filled into it.
# 44 at RFC 0030 steps 3-6 (2026-08-19): the staging window read as a
# slice (twice -- the archive at install, the record at run), the
# transfer window written a chunk at a time, and the cycle counter's
# `rdtsc` for pricing -- unprivileged on this machine by design.
unsafe_budget = 44

[profile.release]
panic = "abort"
opt-level = "z"

[profile.dev]
panic = "abort"
