# SPDX-License-Identifier: Apache-2.0
#
# The AHCI driver, in a domain of its own.
#
# Not a member of the root workspace, for the reason `user/blkd/Cargo.toml`
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# **Which is also why almost nothing is here.** A user crate is outside
# `cargo test --workspace`, so anything written in this file has no host tests
# at all. The bring-up sequence therefore lives in `bhaskix-ahci`, a library
# crate the suite does reach, and this program is the two unsafe accesses that
# crate deliberately cannot perform: one volatile read and one volatile write
# of a mapping the kernel made on request.
[workspace]

[package]
name = "bhaskix-user-ahcid"
description = "The AHCI driver in a domain of its own."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "ahcid"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-ahci = { path = "../../ahci" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 5 at RFC 0046 step 6b — the `_start` stub the ABI requires, the `syscall`
# sequence this program carries rather than taking a dependency for, the `rdtsc`
# its deadlines are measured with, the `ud2` that stops a panic where the kernel
# can see it, and — since step 6b — a **second** `syscall` sequence for `RECV`.
#
# Two and not one because they return different things: `call` hands back a
# status and a value, `receive` hands back a badge, a method and four arguments.
# `bin/blkd` carries the same pair for the same reason. A single wrapper that
# did both would have to return the union of them, which is a wider interface
# than either caller wants.
asm_budget = 5
# **22, and the number is the whole claim.** A driver is usually mostly
# `unsafe`, because a driver is mostly registers: `bin/blkd` sits at 220. This
# one does not, because `bhaskix-ahci` holds the register *arithmetic* under
# `forbid(unsafe_code)` and this program holds only the accesses -- one volatile
# read, one volatile write, one word of report, `rdtsc`, and the syscall and
# entry stubs.
#
# It was 68 before the report was written through a one-line helper instead of
# inside a forty-line block. That is not a saving in danger, it is a saving in
# *reading*: the same one fact, stated once.
#
# `exact`, so shrinking is a build failure too. RFC 0046's remaining steps add
# DMA setup to this program, and each of them should have to come here and say
# what it cost rather than spending headroom nobody reviewed. If this number
# climbs by more than a few lines a step, logic has moved out of the crate the
# tests can reach and into the one they cannot.
# **35 at RFC 0046 step 4, 2026-08-24: +13.** The `exact` budget did its job on
# the first step that had to spend it, so here is the bill:
#
#   - the three raw slices over this program's own memory -- the command list,
#     the command table, and the 512 bytes a *device* writes into. Nine lines of
#     the thirteen, and each one is a window whose length is a constant from
#     `bhaskix-ahci` rather than a number written here.
#   - the stage word, which records how far this program got. Its own line and
#     worth every byte: without it a driver that hangs and a driver that never
#     ran are the same silence, and step 4 spent three boots not knowing which
#     it had.
#   - two atomics' worth of reporting, which are safe, and the `rdtsc` the
#     deadlines already paid for.
#
# What did **not** grow: nothing that decides an offset, an order or a bound.
# `build_command`, `run` and `device_kind` are all in the crate the tests reach.
# **41 at RFC 0046 step 5, 2026-08-24: +6.** The bill, as `exact` requires:
#
#   - wiping the buffer before the read. Left as it was, a read that moved no
#     bytes would be indistinguishable from one that worked, because the
#     IDENTIFY response is still sitting there and its first bytes are not zero.
#     One line, and it is the difference between a gate and a decoration.
#   - the slice over the bytes the disk returned, which is the third window over
#     this program's own memory and the one a *device* filled.
#
# Still nothing that decides an offset, an order or a bound: `plan_read` is in
# the crate, and it is where the disk's own numbers are bounded before they size
# a transfer.
# **58 at RFC 0046 step 6a, 2026-08-24: +17.** The bill:
#
#   - the loop that fills the buffer with the pattern, written a byte at a time
#     through a volatile write. Nine lines, and volatile on purpose: this is
#     memory a bus master is about to read, and a compiler entitled to reorder
#     or elide the stores would be entitled to hand the device a half-built
#     sector.
#   - the comparison loop that reads it back, same reasoning in reverse.
#   - the second wipe, between the write and the read-back, which is the line
#     that stops this test agreeing with itself.
#
# Still nothing that decides an offset, an order or a bound. `plan_write` shares
# `plan_read`'s bounds by construction -- one function, one bit different -- and
# both live in the crate `make test-host` reaches.
# **85 at RFC 0046 step 6b, 2026-08-24: +27.** The bill:
#
#   - `receive`, the `RECV` system call. Fifteen of the twenty-seven, and almost
#     all of it operand list: every argument register is an output because the
#     kernel writes the whole frame back. `bin/blkd`'s costs the same and for the
#     same reason -- this is what becoming a *service* costs a program that was
#     only talking to hardware.
#   - the two slices over the command list and the command table in
#     `plan_and_run`, which is the serving path's copy of what the self-test
#     already had.
#
# Still nothing that decides an offset, an order or a bound. Every request this
# service answers is bounded by `plan_read` or `plan_write` in the crate
# `make test-host` reaches -- including the sector past the end, which is
# refused there rather than asked of the hardware.
unsafe_budget = 85
unsafe_budget_exact = true
