# SPDX-License-Identifier: Apache-2.0
#
# The network driver, placed in its own domain.
#
# Not a member of the root workspace, for the reason user/blkd/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# It does **not** depend on `bhaskix-net`. That crate is the protocol code, and
# linking it here would put a parser for hostile input inside the domain that
# holds this device's DMA authority -- which is precisely the arrangement RFC
# 0018 rejected. This program moves frames and interprets none of them.
[workspace]

[package]
name = "bhaskix-user-netd"
description = "The network driver in a domain of its own."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-device = { path = "../../device" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 3 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the device accesses a driver holding hardware cannot avoid.
asm_budget = 3
# Measured, not guessed. A driver is mostly `unsafe` because a driver is mostly
# registers and rings: every access is a volatile read or write of a mapping the
# kernel made on request, and every descriptor is a store into memory a device
# will read.
#
# What matters is not the count but the reach. None of it can touch anything
# this domain was not given: three pages of registers, eight of its own memory,
# and a device that translates through a page table of its own.
#
# 247 at step 3: the ring to `bin/ipd`, which is two copies into a mapping the
# other domain reads and a volatile publish of the index that makes them
# visible. Above `blkd`'s 220 now, and the reason is the direction rather than
# the volume -- this driver hands memory *on*, and a block driver never does.
#
# 210 lines at step 2, against `blkd`'s 220 for a device with one queue and no receive
# path. Two queues cost more setup and the receive side costs more again; what
# this program does *not* carry is a service loop, which is most of the
# difference the other way. A wild pointer in here faults in ring 3 and takes
# the driver down; the same mistake in a kernel driver takes the machine.
# 306 at step 4a: the return ring from `bin/ipd`, which is a second ring read
# and a transmit buffer filled from it. A driver that only ever sent its own
# bytes now forwards somebody else's, and that is the whole increase.
# 323 at step 6: the queue-size fix needed no unsafe at all, but finding it did.
# A high-water mark of what the device says it wrote, and a count of the buffers
# it is holding — both volatile reads of memory the device shares. Kept rather
# than removed: they are the two numbers that told a dropped frame from a
# misread one, and the next receive bug will want them already there.
# 325 at RFC 0018 step 7: the same copy counter at this end of the ring.
# 327 at RFC 0010 step 6, and it went **up** by two, which is worth saying. The
# ring arithmetic moved to `bhaskix-abi` where it is safe and tested, and what
# is left here is the byte moving — one helper per region rather than the two
# general walkers they replaced. Fewer lines of arithmetic, marginally more
# lines of `unsafe`, and the arithmetic was the part that was getting it wrong.
unsafe_budget = 327
