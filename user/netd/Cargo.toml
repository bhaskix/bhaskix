# SPDX-License-Identifier: Apache-2.0
#
# The network driver, placed in its own domain.
#
# Not a member of the root workspace, for the reason user/blkd/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# It does **not** depend on `bhaskix-net`. That crate is the protocol code, and
# linking it here would put a parser for hostile input inside the domain that
# holds this device's DMA authority -- which is precisely the arrangement RFC
# 0018 rejected. This program moves frames and interprets none of them.
[workspace]

[package]
name = "bhaskix-user-netd"
description = "The network driver in a domain of its own."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-device = { path = "../../device" }
# RFC 0075 step 2: the X722's registers and rings, the crate the kernel used to
# hold as a module. Shared for the reason `bin/ahcid` shares `bhaskix-ahci` --
# a user program is its own workspace and outside `cargo test --workspace`, so
# logic written here would have no host test at all.
bhaskix-i40e = { path = "../../i40e" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 3 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the device accesses a driver holding hardware cannot avoid.
asm_budget = 3
# Measured, not guessed. A driver is mostly `unsafe` because a driver is mostly
# registers and rings: every access is a volatile read or write of a mapping the
# kernel made on request, and every descriptor is a store into memory a device
# will read.
#
# What matters is not the count but the reach. None of it can touch anything
# this domain was not given: three pages of registers, eight of its own memory,
# and a device that translates through a page table of its own.
#
# 247 at step 3: the ring to `bin/ipd`, which is two copies into a mapping the
# other domain reads and a volatile publish of the index that makes them
# visible. Above `blkd`'s 220 now, and the reason is the direction rather than
# the volume -- this driver hands memory *on*, and a block driver never does.
#
# 210 lines at step 2, against `blkd`'s 220 for a device with one queue and no receive
# path. Two queues cost more setup and the receive side costs more again; what
# this program does *not* carry is a service loop, which is most of the
# difference the other way. A wild pointer in here faults in ring 3 and takes
# the driver down; the same mistake in a kernel driver takes the machine.
# 306 at step 4a: the return ring from `bin/ipd`, which is a second ring read
# and a transmit buffer filled from it. A driver that only ever sent its own
# bytes now forwards somebody else's, and that is the whole increase.
# 323 at step 6: the queue-size fix needed no unsafe at all, but finding it did.
# A high-water mark of what the device says it wrote, and a count of the buffers
# it is holding — both volatile reads of memory the device shares. Kept rather
# than removed: they are the two numbers that told a dropped frame from a
# misread one, and the next receive bug will want them already there.
# 325 at RFC 0018 step 7: the same copy counter at this end of the ring.
# 327 at RFC 0010 step 6, and it went **up** by two, which is worth saying. The
# ring arithmetic moved to `bhaskix-abi` where it is safe and tested, and what
# is left here is the byte moving — one helper per region rather than the two
# general walkers they replaced. Fewer lines of arithmetic, marginally more
# lines of `unsafe`, and the arithmetic was the part that was getting it wrong.
# 308 on 2026-08-24, and **not one unsafe operation was deleted**: the
# budget check was over-counting by 19 lines here. It took a whole line's
# brace balance, so `if let Some(x) = unsafe { f() } {` read as still-open and
# charged the outer block's body to this crate. See the changelog; the
# scanner now walks from the block's own brace and has a self-test.
# 327 at RFC 0074 step 4, and every added line is a *second port*. This driver
# drove one device with its windows welded into constants; a bond has two, so
# the constants became a parameter and the register touches doubled -- the
# second device's status write, its address read, its own link register, and the
# five report words the bond publishes. Nineteen lines for a member, and the
# alternative was a second driver domain that would have needed its own ring to
# `bin/ipd` and its own copy of everything above.
# 339 at RFC 0075 step 4: the frames. Six lines -- the report this loop
# publishes as the counts move, and the two ring calls that carry a frame each
# way. Both of those are the *virtio* loop's own unsafe operations, reached
# through the same helpers, which is why the number moves by six and not by the
# size of a second driver.
#
# 333 at RFC 0075 step 3: the report a machine with no virtio device writes.
# Six volatile stores, the same six `report` makes -- and they cannot be shared
# with it, because `report` describes rings and counters that do not exist on a
# machine whose only NIC is an X722. Writing that report from a virtio driver's
# fields would mean inventing values for every one of them.
#
# **327 at RFC 0075 step 2, and the budget did not move: the headroom did.**
# The count was 320 with seven spare; the X722's two trait implementations --
# three register accessors and three memory ones, plus the 64-bit read its
# statistics registers require -- took exactly those seven. Whoever adds the
# next one raises the number rather than finding it already spent, which is
# what this note is for.
#
# 344 at RFC 0076 step 2: the bond's own five words. `x722_bond_report` writes
# members, active member, link bitmap, failovers and frames dropped from the
# backup into the same five slots `bond_report` uses -- one volatile store per
# word, in a loop the counter reads as five lines.
#
# **They are not shared with `bond_report` and the reason is the same one the
# report above gives**: that function derives its numbers from an array of
# virtio `Port`s, and a machine whose only NIC is an X722 has none. The words
# are identical; where they come from is not. What *is* shared is the rule that
# produces the active member -- `select`, called by both loops -- which is the
# part that would actually be wrong if it drifted.
#
# 345 at RFC 0076 step 3: one volatile *read*, and it is the only one in this
# file that runs the other way. `failover_requested` reads a word the kernel
# writes into the report page, because a boot has to be able to ask for a
# failover and on real hardware there is no hypervisor monitor to ask through.
# One word, well clear of the report's twenty-six, and it is a request rather
# than a command -- the driver acts on it only once its bond has carried
# something.
#
# 347 at RFC 0076 step 3's second try: the X722 bond's own announcement. Two
# lines -- the call that fills a frame and the `unsafe fn` boundary it crosses
# -- and the frame itself is *shared* with the virtio bond rather than written
# twice, which is why this is two and not thirty.
#
# **It exists because its absence read as a hardware verdict.** The first boot
# to fail over printed "nothing has crossed since", which looks like a switch
# refusing an address that moved. It was a driver with nothing to send: this
# bond forwarded `bin/ipd`'s frames and had no frame of its own, so the failover
# had nothing to be measured by.
#
# 348 at RFC 0076 step 3's third try: one more store, and it exists because a
# measurement was taken from the wrong instant. The kernel's report compares
# frames handed against a baseline captured when *its* window opens; the
# failover happens earlier, during the wait for a first frame, so a member that
# had been carrying since the change read as one that had carried nothing. This
# word is the same quantity counted by the side that knows when the change was.
#
# Every line of it is a volatile access to a mapping this program was granted,
# which is the operation `bhaskix-i40e` forbids itself so that it lands here.
# 357 at RFC 0076's every-member work, and nine lines is the whole of it: a
# volatile byte copy from the member that took the frame into each other
# member's own transmit buffer.
#
# **It cannot be avoided by pointing two descriptors at one buffer.** A member
# owns its rings, and a descriptor may only name memory its own device reaches
# through its own IOMMU window -- the two ports have separate domains precisely
# so that neither can reach the other's. Copying is what the isolation costs,
# and it is forty-two bytes for an LACPDU.
#
# **It exists because a bundle forms only if every member speaks.** LACPDUs left
# the active member alone, and the SR550's switch -- four ports in one
# channel-group -- heard from one link and synchronised none: LACP state `0x05`,
# partner heard, never aggregated, 2026-09-08.
#
# 361 at RFC 0076's per-member machines, and the four lines are what replaced
# the duplication above. `bin/ipd` now runs one 802.3ad machine per link and
# names the member each LACPDU must leave by, so this program copies a frame to
# **one** other member rather than to all of them, and it stamps the member a
# received frame arrived on so the answer can go back down the same link.
#
# The four: one volatile read of the bond's mode -- the second word the kernel
# writes into this page, and the reason a backup member's frames go up in an
# aggregation and are dropped in active-backup -- and three from the receive
# paths handing a frame across where they used to drop it.
#
# **The copy did not get cheaper, it got rarer.** Duplicating one PDU onto every
# member told the switch that two links shared one `Actor_Port`, which is a
# contradiction under 802.3ad and is why the state stuck at `0x05`. This program
# reads an index and still never a frame.
# 364 at RFC 0076's transmit counter: three lines, one volatile store, and it
# is the only figure in this driver's report that is not the driver's own tally.
# Everything else counts frames *handed over* -- a descriptor posted, a
# write-back seen -- and `GLV_MPTCL` counts multicast packets the VSI actually
# put out. An LACPDU is multicast, so this separates a frame that reached the
# wire from one the device swallowed.
#
# **It exists because its absence made two true statements useless together.**
# `bin/ipd` said 44 LACPDUs sent, the switch said it had received none, and for
# three days nothing in this system could say which side of the MAC they died
# on. The word also carries whether `allow_destination_override` succeeded,
# because that command's result was being discarded and a switch control tag is
# not permitted without it.
# 372 at RFC 0076 step 4, the members' own addresses: eight lines across three
# places. One writes the block of station addresses the kernel reads to tell
# `bin/ipd` what each link is called; one reads a virtio port's address out of
# its device configuration window, which is six bytes this driver already read
# for the first port and had no consumer for on the second; and one calls that
# for each member of the virtio bond.
#
# **The address a control frame leaves under is not the address data leaves
# under**, and this driver published only the second. 802.1AX gives an LACPDU's
# source as the individual address of the port it goes out of; every one of them
# left under port 0's address, four links of one channel-group claiming one
# address. The comment beside the second port's bring-up said its address was
# "read by nobody" and that was true -- which is the whole reason the eight
# lines are here rather than the address being read where it always could have
# been.
# 376 at RFC 0076's port transmit counter: four lines, one more volatile store
# and the word beside it. `GLV_MPTCL` counts what the *VSI* put out and
# `GLPRT_MPTCL` what the *MAC* put out, and the pair is the instrument -- a
# frame that left the VSI and never reached the wire is the difference between
# them and is nothing else anywhere.
#
# **The constants were already here and nothing read them.** `GLPRT_UPTCL`,
# `GLPRT_MPTCL` and `GLPRT_BPTCL` have sat in `bhaskix-i40e` since 2026-09-06
# with their datasheet sections quoted beside them and no caller, which is the
# same shape as `TX_SWTCH_UPLINK` and cost three days there. The extra word also
# carries a *measured* bit, because zero is what a port that sent nothing and a
# word nobody wrote both look like.
# 382 at the same-instant split: six lines, one volatile store of the word that
# says what this program did with the frames it was given -- uplink-tagged posts
# in the low half, `post_frame` refusals in the high.
#
# `sent` cannot answer it. That counts every frame this program puts out, the
# bond's own broadcast announcements included, while the device counter it is
# compared against counts multicast -- so the two are not the same population
# and subtracting them means nothing. An uplink-tagged frame is an LACPDU and
# nothing else this bond sends is.
#
# The refusal half counts a drop that had no counter at all: `carry_x722` takes
# a frame out of the ring and, when `post_frame` will not have it, moves on. The
# frame is gone, and a drop that leaves no number behind is indistinguishable
# from a frame the device swallowed -- which is the confusion three days of
# boots have been spent inside.
# 390 at the write-back question: eight lines, two volatile stores of what this
# loop has always known and never published.
#
# It waits for a write-back after every frame it posts and has thrown the answer
# away since it was written, so the boot that measured "36 uplink-tagged
# descriptors posted, 19 frames transmitted" had no follow-up question it could
# ask. Word 30 counts the posts never written back; word 31 carries this
# program's transmit cursor against the device's `QTX_HEAD`.
#
# A write-back is the device saying it is *done*; the head is the device saying
# it *looked*. The difference matters because a member's frames share one packet
# buffer and a ring eight deep: a descriptor the device has not fetched is one
# this program is about to overwrite, which is a defect here, while one it
# fetched and dropped is a defect there.
# 397 at the read-back: seven lines, a second `Get VSI Parameters` after the
# destination override is commanded and one volatile store of what it found.
#
# **Because commanding a bit is not setting it.** This driver has reported the
# uplink path as healthy on the strength of `Update VSI` returning Ok, while
# every frame carrying a switch control tag was fetched and never written back.
# The section is read back and published as read, and its neighbours -- switch
# id, the two loopback bits -- come with it, because setting the flag is a
# read-modify-write over the whole switching section and a mistake in it would
# show as one of them moving when nothing asked.
#
# The fifth time in this driver that what a mechanism *did* went unread, after
# `TX_SWTCH_UPLINK`, the `GLPRT_*` constants, `VsiTransmitted::since` and
# `stop_lldp_agent`'s discarded result.
# 405 at the malicious-driver record: eight lines, one volatile store carrying
# `PF_MDET_TX`, `GL_MDET_TX` and the members' transmit queue enables.
#
# The SR550 leaves uplink-tagged descriptors unconsumed while plain frames are
# perfect, and with the overwriting fixed the rings simply fill and stay full.
# The device stopping a queue on purpose is the one explanation that is written
# down in the datasheet rather than inferred, and this is where it says so.
#
# **Baselined at bring-up**, because `GL_MDET_TX` holds the *first* event until
# written -- an uncleared one carries a previous boot's event into this boot's
# report, which is the mistake that made `GLV_MPTCL` read the same 38 three boots
# running. `transmit_queue_state` comes with it and had never had a caller: the
# eighth mechanism in this driver written, documented and never asked.
# 414 for the instrument that record needs to be readable: one more volatile
# store for word 39, carrying each member's transmit queue in the device's own
# numbering and each member's **own** `PF_MDET_TX` flag.
#
# `GL_MDET_TX` is one register for the card; `PF_MDET_TX` is one per port. This
# program read the whole record off port 0 and commented that it was global --
# true of the details and false of the flag, so three members' flags were never
# read on any boot this reader has existed. And the record names a queue, which
# for five boots was printed beside no member's queue at all, so `queue 384`
# could not be attributed to anyone.
# 424 for the register that says who owns a transmit queue: one more volatile
# store for word 42, carrying each member's `PF_FUNC_RID.FUNCTION_NUMBER` and
# the `QTX_CTL` its queue reads back.
#
# `QTX_CTL` is the only statement of transmit-queue ownership -- a receive
# queue's owner is implied by the VSI that steers to it -- and
# `own_transmit_queue` has written it since the transmit side existed with
# nothing ever reading it back. Its `PF_INDX` comes from `PF_FUNC_RID`. A window
# answering function 0 on every member would hand all four queues to PF0, and
# the device would then be fetching for a function that is not the one posting.
# That is what the SR550's record describes: an event on absolute queue 384,
# which is member 1's, attributed to PF 0, with only member 0's own flag set.
#
# That hypothesis was wrong: the boot read function 0/1/2/3 and PF_INDX 0/1/2/3,
# every member owning its own queue. What it did prove is that the per-queue
# registers really are PF-relative through each function's window -- four
# distinct values from four BARs at the same offset -- which until then was only
# ever confirmed on member 0, where relative and absolute coincide.
#
# 434 for the value that fits every observation instead: `QS_Handle 0`, the
# transmit arbitration queue set, published per member at word 43. `RDYList` in
# the transmit context was hardcoded to zero while the VSI carried the real
# handle on every boot. 38.31.3.3 says a queue context is fetched "on demand ...
# when it is scheduled", and scheduling is per queue set, so a queue in a set
# that is not its function's is never scheduled and nothing errors. PF0's handle
# is zero, which is why the hardcoded zero looked right -- the same shape as
# FIRSTQ and GLLAN_TXPRE_QDIS, both invisible on function 0 too.
unsafe_budget = 434