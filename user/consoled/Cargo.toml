# SPDX-License-Identifier: Apache-2.0
#
# The console service, placed in its own domain.
#
# Not a member of the root workspace, for the reason user/shell/Cargo.toml
# gives: it needs its own code model and its own linker script, and a workspace
# member cannot have its own `rustflags`.
#
# This program is a *placement* and not a service. Everything it knows about
# consoles comes from bhaskix-service-console, which is the same crate the
# kernel compiles into itself for the nucleus placement -- byte for byte the
# same logic, reached through a context this file builds out of system calls
# instead of out of the kernel's own functions.
[workspace]

[package]
name = "bhaskix-user-consoled"
description = "The console service in a domain of its own."
version = "0.0.0"
edition = "2024"
authors = ["Tarun Kumar Kushwaha"]
repository = "https://github.com/bhaskix/bhaskix"
license = "Apache-2.0"

[[bin]]
name = "consoled"
path = "src/main.rs"

[dependencies]
bhaskix-abi = { path = "../../abi" }
bhaskix-service = { path = "../../service" }
bhaskix-service-console = { path = "../../services/console" }
bhaskix-service-domain = { path = "../../service-domain" }

[profile.release]
panic = "abort"
opt-level = "s"

[package.metadata.bhaskix]
# 3 — A ring 3 program is architecture-specific at the same few points, and
# this budget is those points: the `_start` stub in `global_asm!` that the ABI
# requires, the `syscall` sequence where the program carries its own rather than
# taking `bhaskix-sock`'s, and the `ud2` in its panic handler, which stops where
# the kernel can see it. Plus the syscall stub a console service needs.
# 4 since 2026-08-27: a second `syscall` stub for RFC 0050's `PUT_RUN`, which
# carries an address *and* a length where every method this program used before
# carried one argument. The alternative was widening the existing stub, which
# would make every other call site pass a zero that means nothing.
asm_budget = 4
# Two blocks, sixteen lines: the `syscall` instruction with its operand list
# -- every argument register is an output, because the kernel writes the frame
# back -- and the `ud2` a
# panic ends at. Fewer than the filesystem's placement needs, because this one
# is handed no memory -- every byte it moves goes through a system call, which
# is slower and is the whole of what a console capability permits.
# 31 for RFC 0050's second half: a native program's line was still arriving in
# pieces because this service put one byte per invocation, so `put_run` sends a
# whole chunk at once -- and that needs a second `syscall` stub, because every
# method this program used until now carried one argument and a run needs an
# address and a length. Eleven more lines, all of them one operand list: the
# same shape as the block above it, declared separately rather than by widening
# the existing call, which would have every other site pass a zero that means
# nothing.
unsafe_budget = 31
