#
# The placement table (RFC 0013).
#
# Where each service runs. Changing a `placement` here is meant to be the
# whole of moving a service between the nucleus and its own domain — that is
# the claim RFC 0013 makes, and steps 3 to 5 are what will test it. Until then
# this table records the truth rather than the intention, which is what
# `relocatable` is for: a service that is not yet compiled apart from the
# kernel says so here, in the file, instead of being quietly assumed ready.
#
# `tools/check-placements.sh` enforces:
#
#   - every relocatable service builds with no kernel in the build at all,
#     which is the domain placement's compile and cannot be faked;
#   - every relocatable service's crate depends on nothing but the ABI and the
#     service framework;
#   - the name here is the name the crate declares and the name the machine
#     prints at boot.

[[service]]
name = "console"
placement = "nucleus"
crate = "services/console"
package = "bhaskix-service-console"
relocatable = true

[[service]]
name = "vfs"
placement = "nucleus"
crate = "services/vfs"
package = "bhaskix-service-vfs"
# True as of RFC 0013 step 3. What changed is one function: the bulk path used
# to read a caller's pages through the kernel's direct map, and now asks its
# context to do it (`Bulk::fill`). In the nucleus that is still the direct
# map; in a domain it is a system call. The service above cannot tell which it
# got, and `check-placements.sh` proves the claim by building this crate with
# no kernel in the build at all.
#
# Still `nucleus`: it is relocatable and not yet relocated. Those are two
# different claims, and the table can make them separately on purpose.
relocatable = true
